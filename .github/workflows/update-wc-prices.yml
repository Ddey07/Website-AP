name: Update WC2026 prices

# Refreshes ticket (VividSeats/Apify) and hotel (SerpAPI) prices and commits
# static/wc2026/prices.js — which triggers a Netlify rebuild.
#
# MANUAL ONLY (no schedule). Run it yourself from the Actions tab when you want
# fresh prices. Two reasons there's no daily cron:
#   1. A failed daily fetch was what overwrote real prices with placeholders.
#      (A safety guard in fetch_wc_prices.py now prevents that, but no schedule
#       means no surprise runs at all.)
#   2. The cheap daily query only returns the ~25 soonest matches and replaces
#      the price list wholesale, which would drop the QF/SF/Final prices that a
#      full-coverage run populates.
#
# Requires repo secrets APIFY_TOKEN and/or SERPAPI_KEY. If neither is set the job
# skips without committing, so it can never overwrite good prices with placeholders.

on:
  workflow_dispatch:        # manual run from the Actions tab only
    inputs:
      full_coverage:
        description: "Full bracket (venue-by-venue incl. QF/SF/Final) — ~13x Apify cost"
        type: boolean
        default: false

concurrency:
  group: update-wc-prices
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prices:
    if: github.repository_owner != 'HugoBlox'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Pin the client: newer versions drop `timeout_secs` and return a Run
        # object instead of a dict, which breaks the scraper calls.
        run: pip install "apify-client==2.5.1"

      - name: Fetch prices and commit if changed
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SEATGEEK_CLIENT_ID: ${{ secrets.SEATGEEK_CLIENT_ID }}
          FULL_COVERAGE: ${{ inputs.full_coverage }}
        run: |
          if [ -z "$APIFY_TOKEN" ] && [ -z "$SERPAPI_KEY" ]; then
            echo "No APIFY_TOKEN or SERPAPI_KEY secret set — skipping so prices aren't overwritten with placeholders."
            exit 0
          fi
          python scripts/fetch_wc_prices.py
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/wc2026/prices.js static/wc2026/prices.json
          if git diff --cached --quiet; then
            echo "No price changes."
          else
            git commit -m "data: refresh WC2026 ticket/hotel prices"
            # Resilient push: rebase on top of any concurrent commits, then retry.
            git push || (git pull --rebase --autostash && git push)
          fi
