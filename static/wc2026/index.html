    function haversine(lat1,lon1,lat2,lon2){
      const R=3959,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
      const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R*2*Math.asin(Math.sqrt(a));
    }

    // Match label based on relative ELO strength + absolute tier
    // Considers both competitive balance (diff) and prestige (avg/lower)
    function matchLabel(eloA,eloB){
      const avg=(eloA+eloB)/2;
      const diff=Math.abs(eloA-eloB);
      const higher=Math.max(eloA,eloB);
      const lower=Math.min(eloA,eloB);
      // Both elite — top teams closely matched
      if(lower>=1750) return {label:"Elite clash",   color:"#f59e0b",stars:5};
      // Both strong — high-level even match
      if(lower>=1650&&avg>=1700) return {label:"Top match",      color:"#a3e635",stars:4};
      // Strong team vs capable challenger — upset possible (e.g. Brazil vs Japan)
      if(higher>=1720&&lower>=1450&&diff<=300) return {label:"Upset alert",  color:"#fb923c",stars:4};
      // Similar-tier teams, close gap — even contest (e.g. Ecuador vs Senegal)
      if(diff<=130&&avg>=1550) return {label:"Even contest",  color:"#34d399",stars:3};
      // Lower-tier teams evenly matched
      if(diff<=130) return {label:"Underdog battle",color:"#94a3b8",stars:2};
      // Large gap — one side is a clear dominant favourite
      if(diff>300) return {label:"Mismatch",       color:"#64748b",stars:1};
      // Strong team vs weaker side, moderate gap
      if(higher>=1650) return {label:"Heavy favorite",color:"#60a5fa",stars:2};
      // Mid-table teams, one has edge
      return {label:"Competitive",   color:"#34d399",stars:3};
    }

    async function geocodeCity(query){
      const params=new URLSearchParams({
        q: query,
        format:"json",
        limit:"3",
        countrycodes:"us,mx,ca",
        "accept-language":"en",
      });
      const resp=await fetch(`https://nominatim.openstreetmap.org/search?${params}`,{
        headers:{"User-Agent":"wc2026-bracket/1.0"}
      });
      if(!resp.ok) throw new Error("Geocoding request failed");
      const data=await resp.json();
      if(!data.length) return null;
      const hit=data[0];
      // Build a short display name: "City, State/Province"
      const parts=hit.display_name.split(",").map(s=>s.trim());
      const shortName=parts.slice(0,2).join(", ");
      return {n:shortName, lat:parseFloat(hit.lat), lng:parseFloat(hit.lon)};
    }

    /* ===================== SIMULATION FUNCTIONS ===================== */
    function simGroup(teams){
      const pts={},gd={};
      teams.forEach(t=>{pts[t]=0;gd[t]=0;});
      for(let i=0;i<teams.length;i++){
        for(let j=i+1;j<teams.length;j++){
          const a=teams[i],b=teams[j],pA=wp(a,b)*0.75,r=Math.random();
          if(r<pA){pts[a]+=3;gd[a]+=(1+Math.random());gd[b]-=Math.random();}
          else if(r<pA+0.25){pts[a]+=1;pts[b]+=1;}
          else{pts[b]+=3;gd[b]+=(1+Math.random());gd[a]-=Math.random();}
        }
      }
      return [...teams].sort((a,b)=>pts[b]-pts[a]||gd[b]-gd[a]||Math.random()-.5);
    }
    function assign3rd(thirds){
      const slots=Object.keys(SLOT_ALLOW),res={},used=new Set();

      while(changed){
        changed=false;
        for(const s of slots){
          if(res[s])continue;
          const v=thirds.filter(t=>!used.has(t.team)&&SLOT_ALLOW[s].includes(t.group));
          if(v.length===1){res[s]=v[0].team;used.add(v[0].team);changed=true;}
        }

      for(const s of slots){
        if(res[s])continue;
        const v=thirds.filter(t=>!used.has(t.team)&&SLOT_ALLOW[s].includes(t.group));
        if(v.length>0){res[s]=v[0].team;used.add(v[0].team);}
        else res[s]="TBD";
      }
      return res;
    }

        if(!ok(a,b))return a&&a!=="TBD"?a:b&&b!=="TBD"?b:"TBD";
        out.qf.push({idx,key:key(a,b),teamA:a,teamB:b});

      });

      const sfw=sfp.map(([a,b],idx)=>{
        if(!ok(a,b))return a&&a!=="TBD"?a:b&&b!=="TBD"?b:"TBD";
        out.sf.push({idx,key:key(a,b),teamA:a,teamB:b});
        return simMatch(a,b);
      });
      // SF winners → Championship Final (M104, KO.final[0], idx:0)
      let champion="TBD";
      if(ok(sfw[0],sfw[1])){out.final.push({idx:0,key:key(sfw[0],sfw[1]),teamA:sfw[0],teamB:sfw[1]});champion=simMatch(sfw[0],sfw[1]);}
      else champion=sfw[0]!=="TBD"?sfw[0]:sfw[1];
      // Track team appearances per round per slot
      const teamSlots={r32:{},r16:{},qf:{},sf:{},final:{}};
      for(const [rnd,matches] of Object.entries(out)){
        for(const {idx,teamA,teamB} of matches){
          if(!teamSlots[rnd][idx]) teamSlots[rnd][idx]={};
          for(const t of [teamA,teamB]){
            if(t&&t!=="TBD") teamSlots[rnd][idx][t]=(teamSlots[rnd][idx][t]||0)+1;
          }
        }
      }
      // Track team wins per round (advancing teams)
      const teamRounds={r32:{},r16:{},qf:{},sf:{},final:{}};
      const advancers={
        r32:r32w,r16:r16w,qf:qfw,sf:sfw,final:[champion]
      };
      for(const [rnd,teams] of Object.entries(advancers)){
        for(const t of teams){
          if(t&&t!=="TBD") teamRounds[rnd][t]=(teamRounds[rnd][t]||0)+1;
        }
      }
      return {rounds:out,champion,teamSlots,teamRounds};
    }

    // Assign 8 qualifying 3rd-place teams to valid slots.
    // Uses constraint-sorted backtracking: slots with fewest valid candidates
    // are filled first, preventing greedy from blocking later slots like M85.
    function assignUserThirds(thirds){
      // Sort slots: most constrained (fewest valid teams) first
      const sorted=[...THIRD_SLOT_ORD].sort((a,b)=>
        thirds.filter(t=>SLOT_ALLOW_C[a].includes(t.group)).length-
        thirds.filter(t=>SLOT_ALLOW_C[b].includes(t.group)).length
      );
      const res={};
      function bt(i,used){
        if(i===sorted.length)return true;
        const slot=sorted[i];
        for(const t of thirds){
          if(!used.has(t.team)&&SLOT_ALLOW_C[slot].includes(t.group)){
            used.add(t.team);res[slot]=t.team;
            if(bt(i+1,used))return true;
            used.delete(t.team);delete res[slot];
          }
        }
        return false;
      }
      if(!bt(0,new Set())){
        // Fallback greedy if selection has no complete solution (invalid combo)
        const used=new Set();
        for(const s of THIRD_SLOT_ORD){
          const c=thirds.find(t=>!used.has(t.team)&&SLOT_ALLOW_C[s].includes(t.group));
          res[s]=c?(used.add(c.team),c.team):'TBD';
        }
      }
      return res;
    }

    // Build 16 R32 matchup pairs from group picks + third assignments
    function buildUserR32(gp,ta){
      // Safety: a team picked as 1st/2nd must never also appear as a 3rd-place slot
      const qualified=new Set(Object.values(gp).flatMap(p=>[p.first,p.second]).filter(Boolean));
      const safeTA=Object.fromEntries(Object.entries(ta).map(([k,v])=>[k,qualified.has(v)?'TBD':v]));
      const w=g=>gp[g]?.first||'TBD';
      const r=g=>gp[g]?.second||'TBD';
      const ta2=safeTA;
      return [
        [w('E'),ta2.M74||'TBD'],  // idx0  M74
        [w('I'),ta2.M77||'TBD'],  // idx1  M77
        [r('A'),r('B')],           // idx2  M73
        [w('F'),r('C')],           // idx3  M75
        [r('K'),r('L')],           // idx4  M83
        [w('H'),r('J')],           // idx5  M84
        [w('D'),ta2.M81||'TBD'],  // idx6  M81
        [w('G'),ta2.M82||'TBD'],  // idx7  M82
        [w('C'),r('F')],           // idx8  M76
        [r('E'),r('I')],           // idx9  M78
        [w('A'),ta2.M79||'TBD'],  // idx10 M79
        [w('L'),ta2.M80||'TBD'],  // idx11 M80
        [w('J'),r('H')],           // idx12 M86
        [r('D'),r('G')],           // idx13 M88

      const [tab,setTab]=useState("guide");
      const [progress,setProgress]=useState(0);
      const [done,setDone]=useState(false);
      const [simData,setSimData]=useState({r32:{},r16:{},qf:{},sf:{},final:{}});
      const [teamSlotData,setTeamSlotData]=useState({r32:{},r16:{},qf:{},sf:{},final:{}});
      const [teamRoundData,setTeamRoundData]=useState({r32:{},r16:{},qf:{},sf:{},final:{}});
      const [championData,setChampionData]=useState({});
      const [trackTeam,setTrackTeam]=useState("France");
      const [venueFilter,setVenueFilter]=useState("Atlanta (Mercedes-Benz)");
      const [selectedMapVenue,setSelectedMapVenue]=useState(null);
      const [prices,setPrices]=useState(null);
      const [pricesError,setPricesError]=useState(false);
      const [homeCity,setHomeCity]=useState(null);
      const [cityInput,setCityInput]=useState("");
      const [citySearching,setCitySearching]=useState(false);
      const [cityError,setCityError]=useState(null);
      const [tripRound,setTripRound]=useState("qf");
      const [tripSort,setTripSort]=useState("quality"); // "quality" | "cost"
      const mapRef=useRef(null);
      const mapDivRef=useRef(null);
      const markersRef=useRef({});
      const tileRef=useRef(null);

      // Simulation useEffect
      useEffect(()=>{
        const sc={r32:{},r16:{},qf:{},sf:{},final:{}};
        const ts={r32:{},r16:{},qf:{},sf:{},final:{}};
        const tr={r32:{},r16:{},qf:{},sf:{},final:{}};
        const cc={};
        let done=0;
        function runChunk(){
          const end=Math.min(done+CHUNK,N);
          for(let i=done;i<end;i++){
            const {rounds,champion,teamSlots,teamRounds}=runOnce();
            // matchup counts
            for(const[rnd,matches]of Object.entries(rounds)){
              for(const{idx,key}of matches){
                if(!sc[rnd][idx])sc[rnd][idx]={};
                sc[rnd][idx][key]=(sc[rnd][idx][key]||0)+1;
              }
            }
            // team slot counts
            for(const[rnd,slots]of Object.entries(teamSlots)){
              for(const[idx,teams]of Object.entries(slots)){
                if(!ts[rnd][idx])ts[rnd][idx]={};
                for(const[t,c]of Object.entries(teams)){
                  ts[rnd][idx][t]=(ts[rnd][idx][t]||0)+c;
                }
              }
            }
            // team round advancement
            for(const[rnd,teams]of Object.entries(teamRounds)){
              for(const[t,c]of Object.entries(teams)){
                if(!tr[rnd][t])tr[rnd][t]=0;
                tr[rnd][t]+=c;
              }
            }
            // champion counts
            if(champion&&champion!=="TBD") cc[champion]=(cc[champion]||0)+1;
          }
          done=end;
          setProgress(done);
          if(done<N){
            setTimeout(runChunk,0);
          } else {
            setSimData({...sc});
            setTeamSlotData({...ts});
            setTeamRoundData({...tr});
            setChampionData({...cc});
            setDone(true);
          }
        }
        runChunk();

      // Bracket Challenge auth + data useEffect
      useEffect(()=>{

            const gp={},ko={r32:{},r16:{},qf:{},sf:{},final:{}},thirds=[];

              if(row.round==='grp1'){
                const g=String.fromCharCode(65+row.slot_idx);
                gp[g]={...gp[g],first:row.picked_team};
              } else if(row.round==='grp2'){
                const g=String.fromCharCode(65+row.slot_idx);

                const[grp,team]=row.picked_team.split(':');

              } else if(['r32','r16','qf','sf','final'].includes(row.round)){
                ko[row.round][row.slot_idx]=row.picked_team;

            setGroupPicks(gp);setThirdPicks(thirds);setKoPicks(ko);
            setSavedBracket({gp,thirds,ko});
          }
          setBracketLoading(false);
        };
        const loadLeaderboard=async()=>{
          const[{data:sc},{data:pr}]=await Promise.all([
            sb.from('scores').select('user_id,round,points'),
            sb.from('profiles').select('id,display_name'),
          ]);
          if(!sc||!pr)return;
          const nm={};pr.forEach(p=>nm[p.id]=p.display_name);
          const tot={};

            tot[s.user_id].rounds[s.round]=(tot[s.user_id].rounds[s.round]||0)+s.points;
          }
          setLeaderboard(Object.values(tot).sort((a,b)=>b.total-a.total));
        };
        const fetchProfile=async(uid)=>{
          const{data}=await sb.from('profiles').select('display_name,ab_group').eq('id',uid).single();
          if(data?.display_name)setSbDisplayName(data.display_name);
          if(data?.ab_group)setSbAbGroup(data.ab_group);

        });
        const{data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{
          setSbUser(session?.user||null);
          if(session?.user){loadBracket(session.user.id);fetchProfile(session.user.id);}
          else{setSavedBracket(null);setSbDisplayName('');setSbAbGroup(null);setGroupPicks({});setThirdPicks([]);setKoPicks({r32:{},r16:{},qf:{},sf:{},final:{}});}
        });
        loadLeaderboard();
        return()=>subscription.unsubscribe();
      },[]);

      const autoPick=()=>{
        // ── Step 1 & 2: group picks ──────────────────────────────────
        const autoGP={};
        for(const[g,go]of Object.entries(GROUPS)){
          // 1st = team with highest win%
          const byWin=[...go.teams].sort((a,b)=>(groupQualStats[b]?.win||0)-(groupQualStats[a]?.win||0));
          const first=byWin[0];
          // 2nd = team with highest ru% among the rest
          const second=[...go.teams].filter(t=>t!==first)
            .sort((a,b)=>(groupQualStats[b]?.ru||0)-(groupQualStats[a]?.ru||0))[0];
          autoGP[g]={first,second};
        }
        setGroupPicks(autoGP);

        // ── Step 3: 3rd-place qualifiers ─────────────────────────────
        // For each group take the non-qualified team with highest 3rd%
        const thirdCandidates=[];
        for(const[g,go]of Object.entries(GROUPS)){
          const qual=new Set([autoGP[g].first,autoGP[g].second]);
          const best=[...go.teams].filter(t=>!qual.has(t))
            .sort((a,b)=>(groupQualStats[b]?.third||0)-(groupQualStats[a]?.third||0))[0];
          if(best)thirdCandidates.push({group:g,team:best,prob:groupQualStats[best]?.third||0});
        }
        // Take top 8 by 3rd-place probability
        thirdCandidates.sort((a,b)=>b.prob-a.prob);
        const autoThirds=thirdCandidates.slice(0,8);
        setThirdPicks(autoThirds);

        // ── Step 4: knockout picks ────────────────────────────────────
        const ta=assignUserThirds(autoThirds);
        const r32Teams=buildUserR32(autoGP,ta);
        const autoKO={r32:{},r16:{},qf:{},sf:{},final:{}};
        // Helper: pick higher-ELO team
        const favOf=(tA,tB)=>{
          if(tA==='TBD'||!tA)return tB;if(tB==='TBD'||!tB)return tA;
          const eA=ELO[tA]||1300,eB=ELO[tB]||1300;
          const fA=FORM[tA]||0,fB=FORM[tB]||0;
          const qA=Math.pow(10,(eA+fA*10)/400),qB=Math.pow(10,(eB+fB*10)/400);
          return qA>=qB?tA:tB;
        };
        for(let i=0;i<16;i++){
          const[tA,tB]=r32Teams[i];
          autoKO.r32[i]=favOf(tA,tB);
        }
        for(let i=0;i<8;i++) autoKO.r16[i]=favOf(autoKO.r32[i*2],autoKO.r32[i*2+1]);
        for(let i=0;i<4;i++) autoKO.qf[i]=favOf(autoKO.r16[i*2],autoKO.r16[i*2+1]);
        for(let i=0;i<2;i++) autoKO.sf[i]=favOf(autoKO.qf[i*2],autoKO.qf[i*2+1]);
        autoKO.final[0]=favOf(autoKO.sf[0],autoKO.sf[1]);
        setKoPicks(autoKO);
        // Jump to knockout review step
        setBStep(4);
      };

      function getSlotRows(rnd,idx){

        return Object.entries(data)
          .sort(([,a],[,b])=>b-a)
          .slice(0,3)
          .map(([k,count])=>{
            const [a,b]=k.split("|");
            return {a,b,count};
          });
      }

      // Champion tab data
      // Group qualification stats derived from simulation slot data.
      // r32p maps each group's winner/runner-up to a specific slot index —
      // those mappings are used to separate win%, runner-up%, and 3rd-qualifier%.
      const groupQualStats=useMemo(()=>{
        if(!done)return{};
        // Which r32 slot each group's WINNER occupies
        const WIN_SLOT={A:10,B:14,C:8,D:6,E:0,F:3,G:7,H:5,I:1,J:12,K:15,L:11};
        // Which r32 slot each group's RUNNER-UP occupies
        const RU_SLOT ={A:2,B:2,C:3,D:13,E:9,F:8,G:13,H:12,I:9,J:5,K:4,L:4};
        const r32s=teamSlotData.r32||{};
        const stats={};
        for(const[g,go]of Object.entries(GROUPS)){
          const ws=WIN_SLOT[g], rs=RU_SLOT[g];
          for(const team of go.teams){
            const wc=(r32s[ws]?.[team]||0);
            const rc=(r32s[rs]?.[team]||0);
            // 3rd-place appearances = any slot that is NOT the win/ru slot for this group
            let tc=0;
            for(const[si,teams]of Object.entries(r32s)){
              const i=Number(si);
              if(i!==ws&&i!==rs)tc+=(teams[team]||0);
            }
            stats[team]={
              win:Math.round(wc/N*100),
              ru:Math.round(rc/N*100),
              third:Math.round(tc/N*100),
              qual:Math.round((wc+rc+tc)/N*100),
            };
          }
        }
        return stats;
      },[done,teamSlotData]);

          const slotData=teamSlotData[rnd]||{};

              // Derive opponents from actual head-to-head matchup counts in simData.
              // This prevents same-group teammates appearing as "opponents" — they share
              // a slot bucket across different simulation branches but never face each other.
              const matchups=simData[rnd]?.[idx]||{};
              const opps=Object.entries(matchups)
                .filter(([k])=>k.split("|").includes(trackTeam))
                .map(([k,c])=>{
                  const [tA,tB]=k.split("|");
                  return {team:(tA===trackTeam?tB:tA),count:c};

                .sort((a,b)=>b.count-a.count)
                .slice(0,3)
                .map(({team,count})=>({team,pct:(count/N*100)}));
              mySlots.push({idx:Number(idx),slotFreq,opps});
            }

          mySlots.sort((a,b)=>b.slotFreq-a.slotFreq);
          // pct = probability of REACHING this round (sum of slot appearance frequencies)
          // not teamRoundData which counts advancements (wins), not appearances
          const pct=mySlots.reduce((sum,s)=>sum+s.slotFreq,0);
          return {rnd,pct,slots:mySlots};

                  {/* Quick-pick popular cities */}
                  {!homeCity&&(
                    <div>
                      <div style={{color:"#475569",fontSize:11,marginBottom:6}}>Quick pick:</div>
                      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                        {["New York, NY","Los Angeles, CA","Chicago, IL","Houston, TX","Miami, FL",
                          "Dallas, TX","Seattle, WA","Boston, MA","Atlanta, GA","Toronto, ON",
                          "Vancouver, BC","Mexico City, MX"].map(cn=>{
                          const city=HOME_CITIES.find(c=>c.n===cn);
                          if(!city)return null;
                          return(
                            <button key={cn}
                              onClick={()=>{setHomeCity(city);setCityInput(city.n);setCityError(null);}}
                              style={{
                                background:"#061228",border:"1px solid #1e3a5f",color:"#94a3b8",
                                borderRadius:20,padding:"4px 12px",fontSize:11,cursor:"pointer",
                              }}>{cn.split(",")[0]}</button>
                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>

                <div style={{marginBottom:20}}>
                  <div style={{color:"#64748b",fontSize:11,fontWeight:700,marginBottom:4}}>ROUND TO ATTEND</div>
                  <select value={tripRound} onChange={e=>setTripRound(e.target.value)} style={{
                    background:"#0d1f3c",border:"1px solid #1e3a5f",color:"#e2e8f0",
                    borderRadius:8,padding:"10px 16px",fontSize:14,cursor:"pointer",outline:"none"
                  }}>
                    <option value="group">Group Stage</option>
                    <option value="r32">Round of 32</option>
                    <option value="r16">Round of 16</option>
                    <option value="qf">Quarterfinals</option>
                    <option value="sf">Semifinals</option>
                    <option value="final">Final</option>
                  </select>
                </div>

                {homeCity?(()=>{
                  const DAY_TRIP_MILES=180;

                  // ── Build a row for every individual match in the selected round ──
                  const allMatchRows=[];

                  if(tripRound==="group"){
                    for(const[grp,matches] of Object.entries(GS)){
                      for(const m of matches){
                        const vc=VENUE_COORDS[m.venue];
                        if(!vc)continue;
                        const isoDate=toISO(m.date);
                        const matchKey=`${isoDate}|${m.venue}`;
                        const eloA=ELO[m.a]||1300, eloB=ELO[m.b]||1300;
                        const sumElo=eloA+eloB;
                        const tk=prices?.matches?.[matchKey]
                               ||prices?.tiers?.group
                               ||{low:150,high:700};
                        const dist=Math.round(haversine(homeCity.lat,homeCity.lng,vc.lat,vc.lng));
                        const isDayTrip=dist<DAY_TRIP_MILES;
                        const tc=travelCost(dist);
                        const hcRaw=prices?.hotels?.[m.venue]?.group||HOTEL_COST[m.venue]||{low:150,high:400};
                        const hc=isDayTrip?{low:0,high:50}:hcRaw;
                        const totalLow=tc.low+hc.low+tk.low;
                        const totalHigh=tc.high+(isDayTrip?hc.high:hc.high*2)+tk.high;
                        allMatchRows.push({
                          t1:m.a,t2:m.b,date:m.date,isoDate,venue:m.venue,group:grp,
                          certain:true,pct:null,altMatchups:[],
                          eloA,eloB,sumElo,matchKey,tk,tc,hc,isDayTrip,dist,totalLow,totalHigh,
                          venueCity:vc.city||m.venue,
                        });
                      }
                    }
                  } else {
                    (KO[tripRound]||[]).forEach((sl,idx)=>{
                      const vc=VENUE_COORDS[sl.venue];
                      if(!vc)return;
                      const isoDate=toISO(sl.date);
                      const matchKey=`${isoDate}|${sl.venue}`;
                      // Parse numeric match ID from slot label e.g. "M87" → 87
                      const matchNum=sl.m?parseInt(sl.m.replace(/^M/,""),10):null;
                      const counts=simData[tripRound]?.[idx]||{};
                      const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
                      let t1="TBD",t2="TBD",pct=null,sumElo=2800;
                      if(sorted.length){
                        const[key,cnt]=sorted[0];
                        [t1,t2]=key.split("|");
                        pct=Math.round((cnt/N)*100);
                        // Probability-weighted sum ELO across top matchups
                        let wElo=0,wSum=0;
                        for(const[k,c] of sorted.slice(0,6)){
                          const[ta,tb]=k.split("|");
                          const w=c/N;
                          wElo+=w*((ELO[ta]||1300)+(ELO[tb]||1300));
                          wSum+=w;
                        }
                        sumElo=wSum>0?wElo/wSum:2800;
                      }
                      const altMatchups=sorted.slice(1,4).map(([k,c])=>{
                        const[ta,tb]=k.split("|");
                        return{ta,tb,pct:Math.round((c/N)*100)};
                      });
                      // Ticket lookup: match number (most precise) → date+venue → global tier
                      const tk=(matchNum&&prices?.matchById?.[matchNum])
                             ||prices?.matches?.[matchKey]
                             ||prices?.tiers?.[tripRound]
                             ||{low:200,high:900};
                      const dist=Math.round(haversine(homeCity.lat,homeCity.lng,vc.lat,vc.lng));
                      const isDayTrip=dist<DAY_TRIP_MILES;
                      const tc=travelCost(dist);
                      const hcRaw=prices?.hotels?.[sl.venue]?.[tripRound]
                                ||prices?.hotels?.[sl.venue]?.group
                                ||HOTEL_COST[sl.venue]||{low:150,high:400};
                      const hc=isDayTrip?{low:0,high:50}:hcRaw;
                      const totalLow=tc.low+hc.low+tk.low;
                      const totalHigh=tc.high+(isDayTrip?hc.high:hc.high*2)+tk.high;
                      const eloA=ELO[t1]||sumElo/2, eloB=ELO[t2]||sumElo/2;
                      allMatchRows.push({
                        t1,t2,date:sl.date,isoDate,venue:sl.venue,slotM:sl.m,
                        certain:false,pct,altMatchups,
                        eloA,eloB,sumElo,matchKey,matchNum,tk,tc,hc,isDayTrip,dist,totalLow,totalHigh,
                        venueCity:vc.city||sl.venue,
                      });
                    });
                  }

                  // Best match score: quality × affordability
                  // Label scores compressed so ELO (~1300–1877) is a meaningful co-contributor.
                  // typicalCost = 85% weight on low end + 15% on high — penalises astronomical
                  // ticket ceilings (e.g. $82k for Morocco–Netherlands) even when the low is cheap.
                  // Soft penalty: quality × 2000/(2000+cost), so a $2k trip costs ~half the score.
                  const LABEL_SCORE={"Elite clash":500,"Top match":400,"Upset alert":380,"Even contest":350,"Competitive":250,"Heavy favorite":150,"Underdog battle":120,"Underdog clash":90,"Mismatch":40};
                  const qScore=r=>{
                    const{label}=matchLabel(r.eloA,r.eloB);
                    const raw=(LABEL_SCORE[label]||0)+(r.eloA+r.eloB)/2;
                    const typicalCost=r.totalLow+(r.totalHigh-r.totalLow)*0.15;
                    return raw*2000/(2000+typicalCost);
                  };
                  const sorted=[...allMatchRows].sort((a,b)=>
                    tripSort==="cost"?(a.totalLow-b.totalLow):(qScore(b)-qScore(a))
                  );
                  const top3=sorted.slice(0,3);
                  const MEDAL=["#1","#2","#3"];

                  const ROUND_LABEL={group:"Group Stage",r32:"Round of 32",r16:"Round of 16",qf:"Quarterfinals",sf:"Semifinals",final:"Final"};

                  return (
                    <div>
                      {/* ── Prices load warning ── */}
                      {pricesError&&(
                        <div style={{background:"#1c0a00",border:"1px solid #92400e",borderRadius:8,padding:"8px 12px",marginBottom:12,color:"#fbbf24",fontSize:12}}>
                          ⚠️ Could not load live ticket prices — run <code>python scripts/fetch_wc_prices.py</code> to generate prices.json, then refresh.
                        </div>
                      )}
                      {/* ── Header + sort toggle ── */}
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,marginBottom:16}}>
                        <div style={{color:"#94a3b8",fontSize:13}}>
                          Top 3 <b style={{color:"#f1f5f9"}}>{tripSort==="quality"?"highest-quality":"cheapest"}</b> {ROUND_LABEL[tripRound]} matches from <b style={{color:"#f1f5f9"}}>{homeCity.n}</b>
                        </div>
                        <div style={{display:"flex",gap:4}}>
                          {[["quality","⭐ Best Match"],["cost","💰 Cheapest"]].map(([v,lbl])=>(
                            <button key={v} onClick={()=>setTripSort(v)} style={{
                              background:tripSort===v?"#1e3a5f":"transparent",
                              border:`1px solid ${tripSort===v?"#3b82f6":"#1e3a5f"}`,
                              color:tripSort===v?"#93c5fd":"#64748b",
                              borderRadius:20,padding:"4px 12px",fontSize:11,
                              cursor:"pointer",fontWeight:tripSort===v?700:400,
                            }}>{lbl}</button>
                          ))}
                        </div>
                      </div>

                      {top3.map((row,i)=>{
                        const{t1,t2,date,venue,group,certain,pct,altMatchups,
                              eloA,eloB,sumElo,tk,tc,hc,isDayTrip,dist,totalLow,totalHigh,venueCity}=row;
                        const{label:matchLbl,color:matchColor,stars}=matchLabel(eloA,eloB);
                        const totalColor=totalLow<600?"#4ade80":totalLow<1200?"#fbbf24":"#f87171";
                        const vt=venueType(venue);
                        const showFlight=tc.mode.includes("✈️");
                        const isSelected=venue===selectedMapVenue;
                        const hasLiveTicket=!!(
                          (row.matchNum&&prices?.matchById?.[row.matchNum])
                          ||prices?.matches?.[row.matchKey]
                        );

                        return (
                          <div key={`${row.isoDate}-${venue}`} style={{
                            background:isSelected?"#0a1f3f":"#050e20",
                            border:`2px solid ${isSelected?"#3b82f6":"#1e3a5f"}`,
                            borderRadius:12,padding:"14px 16px",marginBottom:12,
                            transition:"all 0.15s",
                          }}>
                            {/* ── Match quality + medal header ── */}
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:6}}>
                              <div style={{display:"flex",alignItems:"center",gap:8}}>
                                <span style={{fontSize:11,fontWeight:700,color:'#60a5fa',
                                  background:'#1e3a5f',borderRadius:4,padding:'2px 6px'}}>{MEDAL[i]}</span>
                                {/* Quality stars */}
                                <span style={{color:matchColor,fontSize:15,letterSpacing:1}}>
                                  {"★".repeat(stars)}{"☆".repeat(5-stars)}
                                </span>
                                <span style={{
                                  background:"#0d1f3c",border:`1px solid ${matchColor}`,
                                  color:matchColor,fontSize:10,fontWeight:700,
                                  padding:"2px 8px",borderRadius:10,
                                }}>
                                  {matchLbl}
                                </span>
                                {hasLiveTicket&&(
                                  <span style={{
                                    background:"#052e16",border:"1px solid #166534",
                                    color:"#4ade80",fontSize:10,fontWeight:700,
                                    padding:"2px 8px",borderRadius:10,
                                  }}>🎟️ Live price</span>
                                )}
                              </div>
                              <span style={{color:"#334155",fontSize:11}}>{date}</span>
                            </div>

                            {/* ── Teams ── */}
                            <div
                              onClick={()=>{setSelectedMapVenue(venue);window.scrollTo({top:0,behavior:"smooth"});}}
                              style={{cursor:"pointer"}}
                            >
                              <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:6}}>
                                <span style={{fontSize:17,fontWeight:700,color:"#f1f5f9"}}>
                                  {t1!=="TBD"?`${fl(t1)} ${t1}`:"TBD"}
                                  <span style={{color:"#475569",fontSize:12,margin:"0 4px"}}>#{RANKS[t1]||"–"}</span>
                                </span>
                                <span style={{color:"#475569",fontSize:14,fontWeight:600}}>vs</span>
                                <span style={{fontSize:17,fontWeight:700,color:"#f1f5f9"}}>
                                  {t2!=="TBD"?`${fl(t2)} ${t2}`:"TBD"}
                                  <span style={{color:"#475569",fontSize:12,margin:"0 4px"}}>#{RANKS[t2]||"–"}</span>
                                </span>
                                {certain&&group&&<span style={{color:"#64748b",fontSize:11,background:"#0d1f3c",padding:"1px 8px",borderRadius:10}}>Group {group}</span>}
                                {!certain&&pct!==null&&(
                                  <span style={{background:"#1e3a5f",color:"#93c5fd",fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:10}}>
                                    {pct}% likely
                                  </span>
                                )}
                              </div>

                              {/* Alt matchups for KO */}
                              {!certain&&altMatchups.length>0&&done&&(
                                <div style={{color:"#334155",fontSize:11,marginBottom:6}}>
                                  <span style={{color:"#475569",marginRight:4}}>Also possible:</span>
                                  {altMatchups.map((m,j)=>(
                                    <span key={j} style={{marginRight:10}}>
                                      {fl(m.ta)}{fl(m.tb)} {m.pct}%
                                    </span>
                                  ))}
                                </div>
                              )}
                              {!certain&&!done&&<div style={{color:"#334155",fontSize:11,marginBottom:6}}>Sim running…</div>}

                              {/* ── Venue + distance ── */}
                              <div style={{
                                display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",
                                padding:"7px 0",borderTop:"1px solid #0d1f3c",borderBottom:"1px solid #0d1f3c",
                                margin:"6px 0",
                              }}>
                                <span style={{color:"#64748b",fontSize:12,fontWeight:600}}>📍 {venue}</span>
                                {isDayTrip&&<span style={{background:"#052e16",color:"#4ade80",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:10,border:"1px solid #166534"}}>🚗 Day trip</span>}
                                {vt==="canada"&&<span style={{color:"#22c55e",fontSize:11}}>🍁 Canada</span>}
                                {vt==="mexico"&&<span style={{color:"#f97316",fontSize:11}}>🇲🇽 Mexico</span>}
                                <span style={{color:"#475569",fontSize:11,marginLeft:"auto"}}>{dist.toLocaleString()} mi · {tc.mode}</span>
                              </div>

                              {/* ── Cost breakdown ── */}
                              <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginTop:8}}>
                                <span style={{color:totalColor,fontWeight:800,fontSize:16,marginRight:4}}>
                                  ${totalLow.toLocaleString()}–${totalHigh.toLocaleString()}
                                </span>
                                <span style={{background:"#0d1f3c",border:"1px solid #1e3a5f",color:"#93c5fd",fontSize:11,padding:"2px 8px",borderRadius:20}}>
                                  ✈️ ${tc.low}–${tc.high}
                                </span>
                                <span style={{background:"#0d1f3c",border:"1px solid #1e3a5f",color:isDayTrip?"#4ade80":"#fcd34d",fontSize:11,padding:"2px 8px",borderRadius:20}}>
                                  {isDayTrip?"🚗 No hotel":`🏨 $${hc.low}–$${hc.high}/nt`}
                                </span>
                                <span style={{background:"#0d1f3c",border:`1px solid ${hasLiveTicket?"#166534":"#1e3a5f"}`,color:"#c4b5fd",fontSize:11,padding:"2px 8px",borderRadius:20}}>
                                  🎟️ ${tk.low}–${tk.high}
                                </span>
                              </div>
                            </div>

                            {/* Flight link */}
                            {showFlight&&(
                              <div onClick={ev=>ev.stopPropagation()} style={{marginTop:10}}>
                                <FlightsButton fromCity={homeCity.n.split(",")[0]} toCity={venueCity}/>
                              </div>
                            )}
                          </div>
                        );
                      })}

                      {sorted.length>3&&(
                        <div style={{color:"#334155",fontSize:11,textAlign:"center",padding:"6px 0"}}>
                          +{sorted.length-3} more {ROUND_LABEL[tripRound]} matches available — click any map pin to explore a venue
                        </div>
                      )}
                      <div style={{color:"#334155",fontSize:11,marginTop:10}}>
                        * Quality ★ = avg ELO of both teams. Day trip = within {DAY_TRIP_MILES} mi. All costs estimated. 🎟️ Live price = real VividSeats listing.
                      </div>
                    </div>
                  );
                })():(
                  <div style={{color:"#475569",textAlign:"center",padding:"40px 0",fontSize:14}}>
                    Select your home city above to see the best matches to attend
                  </div>
                )}
              </div>
            )}

            {/* =============== FIFA RANKINGS TAB =============== */}
            {tab==="rankings"&&(
              <div>
                <h2 style={{fontSize:18,fontWeight:700,color:"#f1f5f9",marginBottom:4}}>📊 FIFA World Rankings</h2>
                <p style={{color:"#64748b",fontSize:13,marginBottom:20}}>All 48 qualified teams ranked by ELO rating with recent form indicator</p>
                <div style={{
                  display:"grid",gap:5,
                }}>
                  {SORTED_ELO.map(([t,elo],i)=>{
                    const f=FORM[t]||0;
                    const maxElo=SORTED_ELO[0][1];
                    const barW=(elo/maxElo)*100;
                    const teamColor=COLORS[t]||"#334155";
                    return (
                      <div key={t} style={{
                        background:"#061228",border:"1px solid #1e3a5f",
                        borderRadius:8,padding:"8px 12px",
                        display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"
                      }}>
                        <span style={{color:"#475569",fontSize:12,minWidth:24,textAlign:"right"}}>{i+1}</span>
                        <span style={{fontSize:20}}>{fl(t)}</span>
                        <div style={{flex:1,minWidth:120}}>
                          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3,flexWrap:"wrap"}}>
                            <span style={{fontWeight:600,fontSize:13}}>{t}</span>
                            <span style={{
                              color:fc(f),fontSize:11,fontWeight:700,
                              background:"#0d1f3c",padding:"1px 6px",borderRadius:10
                            }}>{fa(f)}</span>
                          </div>
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <div style={{flex:1,height:6,background:"#0d1f3c",borderRadius:3,overflow:"hidden"}}>
                              <div style={{width:`${barW}%`,height:"100%",background:teamColor,borderRadius:3}}/>
                            </div>
                            <span style={{color:"#60a5fa",fontSize:12,fontWeight:700,minWidth:36,textAlign:"right"}}>{elo}</span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* =============== GROUP STAGE TAB =============== */}
            {tab==="groups"&&(
              <div>
                <h2 style={{fontSize:18,fontWeight:700,color:"#f1f5f9",marginBottom:4}}>🏟️ Group Stage</h2>
                <p style={{color:"#64748b",fontSize:13,marginBottom:20}}>All 12 groups with projected qualifiers and match schedule</p>
                {Object.entries(GROUPS).map(([letter,g])=>(
                  <GroupCard key={letter} letter={letter} g={g} />
                ))}
              </div>
            )}

            {/* =============== KNOCKOUT ROUND TABS =============== */}
            {["r32","r16","qf","sf","final"].map(rnd=>{
              if(tab!==rnd)return null;
              const slots=KO[rnd]||[];
              const label=ROUND_LABELS[rnd];
              const n=rnd==="r32"?16:rnd==="r16"?8:rnd==="qf"?4:rnd==="sf"?2:1;
              return (
                <div key={rnd}>
                  <h2 style={{fontSize:18,fontWeight:700,color:"#f1f5f9",marginBottom:4}}>{label}</h2>
                  <p style={{color:"#64748b",fontSize:13,marginBottom:20}}>
                    {n} match{n>1?"es":""} — top 3 most likely matchups from {N.toLocaleString()} simulations
                  </p>
                  {slots.map((slot,idx)=>{
                    const rows=getSlotRows(rnd,idx);
                    return <SlotCard key={slot.m} slot={slot} rows={rows} N={N} tier={rnd} prices={prices}/>;
                  })}
                </div>
              );
            })}

            {/* FOOTER */}
            <div style={{
              borderTop:"1px solid #1e3a5f",
              paddingTop:20,
              marginTop:20,
              textAlign:"center",
              color:"#334155",
              fontSize:12,
            }}>
              Monte Carlo simulation using official FIFA rankings (April 2026) · Built by{" "}
              <a href="https://debangandey.rbind.io" style={{color:"#475569",textDecoration:"none"}}>Debangan Dey</a>
            </div>
              </div>{/* /tab content */}
            </div>{/* /main scroll area */}
          </div>{/* /body row */}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
