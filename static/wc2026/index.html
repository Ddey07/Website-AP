      const handleSignOut=async()=>{
        await sb.auth.signOut();
        setSavedBracket(null);setBStep(1);
      };

      const saveBracket=async()=>{
        if(!sbUser)return;
        if(IS_LOCKED()){alert('Predictions are locked — the tournament has started!');return;}
        setSaving(true);
        // Verify the session is still live (guards against deleted-account sessions)
        const{data:{user:liveUser},error:sessionErr}=await sb.auth.getUser();
        if(sessionErr||!liveUser){
          setSaving(false);
          await sb.auth.signOut();
          setSbUser(null);setSbDisplayName('');setSbAbGroup(null);setSavedBracket(null);
          alert('Your session has expired or this account no longer exists. Please sign in again.');
          return;
        }
        // Guarantee profile row exists — FK on predictions requires it.
        // Priority: name already in state > signup form > email prefix.
        // ignoreDuplicates:true preserves existing display names on re-saves.
        const fallbackName=sbDisplayName||authName.trim()||sbUser.email?.split('@')[0]||'Player';
        const{error:profErr}=await sb.from('profiles').upsert(
          {id:sbUser.id,display_name:fallbackName,...(sbAbGroup?{ab_group:sbAbGroup}:{})},
          {onConflict:'id',ignoreDuplicates:true}
        );
        if(profErr){setSaving(false);alert('Profile error: '+profErr.message);return;}
        const rows=[];
        for(const[g,p]of Object.entries(groupPicks)){
          const idx=g.charCodeAt(0)-65;
          if(p.first)rows.push({user_id:sbUser.id,round:'grp1',slot_idx:idx,picked_team:p.first});
          if(p.second)rows.push({user_id:sbUser.id,round:'grp2',slot_idx:idx,picked_team:p.second});
        }
        thirdPicks.forEach((t,i)=>rows.push({user_id:sbUser.id,round:'grpT',slot_idx:i,picked_team:`${t.group}:${t.team}`}));
        for(const[rnd,slots]of Object.entries(koPicks))
          for(const[idx,team]of Object.entries(slots))
            if(team)rows.push({user_id:sbUser.id,round:rnd,slot_idx:Number(idx),picked_team:team});
        const{error}=await sb.from('predictions').upsert(rows,{onConflict:'user_id,round,slot_idx'});
        setSaving(false);
        if(!error){
          setSavedBracket({gp:groupPicks,thirds:thirdPicks,ko:koPicks});
          // Ensure display name in state matches what was written to DB
          if(!sbDisplayName)setSbDisplayName(fallbackName);
        }
        else alert('Save failed: '+error.message);
      };

      // Prices useEffect
      useEffect(()=>{
        // prices.js sets window.WC_PRICES synchronously — no fetch needed,
        // works with file://, hugo server, and deployed builds alike.
        if(window.WC_PRICES){
          setPrices(window.WC_PRICES);
        } else {
          setPricesError(true);
        }
      },[]);

      // Leaflet map init useEffect
      useEffect(()=>{
        if(mapRef.current||!mapDivRef.current||typeof L==="undefined") return;
        const map=L.map(mapDivRef.current,{
          center:[38,-100],zoom:3,
          scrollWheelZoom:false,
          zoomControl:true,
        });
        const tile=L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{
          attribution:"© OpenStreetMap © CARTO",maxZoom:19
        }).addTo(map);
        tileRef.current=tile;
        mapRef.current=map;
        // Let layout settle then recalculate map bounds
        setTimeout(()=>map.invalidateSize(),100);

        Object.entries(VENUE_COORDS).forEach(([name,{lat,lng}])=>{
          const color=venueColor(name);
          const m=L.circleMarker([lat,lng],{
            radius:11,fillColor:color,color:"#ffffff",
            weight:2,opacity:1,fillOpacity:0.9
          }).addTo(map);
          m.bindTooltip(name,{direction:"top",offset:[0,-8]});
          m.on("click",()=>setSelectedMapVenue(prev=>prev===name?null:name));
          markersRef.current[name]=m;
        });
      },[]);

      // Marker style update useEffect
      useEffect(()=>{
        Object.entries(markersRef.current).forEach(([name,marker])=>{
          const isSelected=name===selectedMapVenue;
          let color=venueColor(name);
          if(tab==="trip"&&homeCity){
            const vc=VENUE_COORDS[name];
            if(vc){
              const dist=haversine(homeCity.lat,homeCity.lng,vc.lat,vc.lng);
              const tc=travelCost(dist);
              const hc=HOTEL_COST[name]||{low:150,high:400};
              const tk=prices?.tiers?.[tripRound]||{low:200};
              const total=tc.low+hc.low+tk.low;
              color=total<600?"#4ade80":total<1200?"#fbbf24":"#f87171";
            }
          }
          marker.setStyle({
            fillColor:color,
            weight:isSelected?3:2,
            radius:isSelected?15:11,
            color:isSelected?"#ffffff":"#ffffff",
            fillOpacity:isSelected?1:0.9,
          });
        });
      },[selectedMapVenue,tab,homeCity,tripRound,prices]);

      // Swap map tile layer when dark/light mode changes
      useEffect(()=>{
        if(!mapRef.current||typeof L==="undefined") return;
        if(tileRef.current) tileRef.current.remove();
        const url=darkMode
          ?"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"
          :"https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png";
        tileRef.current=L.tileLayer(url,{attribution:"© OpenStreetMap © CARTO",maxZoom:19}).addTo(mapRef.current);
        // Update marker border color for contrast on new tile
        const borderColor=darkMode?"#ffffff":"#1e293b";
        Object.values(markersRef.current).forEach(m=>m.setStyle({color:borderColor,weight:darkMode?2:1.5}));
        setTimeout(()=>mapRef.current&&mapRef.current.invalidateSize(),50);
      },[darkMode]);

      const allVenues=useMemo(()=>getAllVenues(),[]);

      // Build slot rows from simData
      function getSlotRows(rnd,idx){
        const data=simData[rnd]&&simData[rnd][idx]?simData[rnd][idx]:{};
        return Object.entries(data)
          .sort(([,a],[,b])=>b-a)
          .slice(0,3)
          .map(([k,count])=>{
            const [a,b]=k.split("|");
            return {a,b,count};
          });
      }

      // Champion tab data
      // Group qualification stats derived from simulation slot data.
      // r32p maps each group's winner/runner-up to a specific slot index —
      // those mappings are used to separate win%, runner-up%, and 3rd-qualifier%.
      const groupQualStats=useMemo(()=>{
        if(!done)return{};
        // Which r32 slot each group's WINNER occupies
        const WIN_SLOT={A:10,B:14,C:8,D:6,E:0,F:3,G:7,H:5,I:1,J:12,K:15,L:11};
        // Which r32 slot each group's RUNNER-UP occupies
        const RU_SLOT ={A:2,B:2,C:3,D:13,E:9,F:8,G:13,H:12,I:9,J:5,K:4,L:4};
        const r32s=teamSlotData.r32||{};
        const stats={};
        for(const[g,go]of Object.entries(GROUPS)){
          const ws=WIN_SLOT[g], rs=RU_SLOT[g];
          for(const team of go.teams){
            const wc=(r32s[ws]?.[team]||0);
            const rc=(r32s[rs]?.[team]||0);
            // 3rd-place appearances = any slot that is NOT the win/ru slot for this group
            let tc=0;
            for(const[si,teams]of Object.entries(r32s)){
              const i=Number(si);
              if(i!==ws&&i!==rs)tc+=(teams[team]||0);
            }
            stats[team]={
              win:Math.round(wc/N*100),
              ru:Math.round(rc/N*100),
              third:Math.round(tc/N*100),
              qual:Math.round((wc+rc+tc)/N*100),
            };
          }
        }
        return stats;
      },[done,teamSlotData]);

      const champRows=useMemo(()=>{
        return Object.entries(ELO)
          .map(([t])=>({team:t,count:championData[t]||0}))
          .sort((a,b)=>b.count-a.count);
      },[championData]);

      // Track a team data
      const trackData=useMemo(()=>{
        if(!trackTeam)return null;
        // find group
        let teamGroup=null,groupObj=null;
        for(const[g,go]of Object.entries(GROUPS)){
          if(go.teams.includes(trackTeam)){teamGroup=g;groupObj=go;break;}
        }
        // round data
        const rounds=["r32","r16","qf","sf","final"];
        const roundInfo=rounds.map(rnd=>{
          // find which slots this team appeared in
          const slotData=teamSlotData[rnd]||{};
          const mySlots=[];
          for(const[idx,teams]of Object.entries(slotData)){
            if(teams[trackTeam]){
              const slotFreq=(teams[trackTeam]/N*100);
              // Derive opponents from actual head-to-head matchup counts in simData.
              // This prevents same-group teammates appearing as "opponents" — they share
              // a slot bucket across different simulation branches but never face each other.
              const matchups=simData[rnd]?.[idx]||{};
              const opps=Object.entries(matchups)
                .filter(([k])=>k.split("|").includes(trackTeam))
                .map(([k,c])=>{
                  const [tA,tB]=k.split("|");
                  return {team:(tA===trackTeam?tB:tA),count:c};
                })
                .sort((a,b)=>b.count-a.count)
                .slice(0,3)
                .map(({team,count})=>({team,pct:(count/N*100)}));
              mySlots.push({idx:Number(idx),slotFreq,opps});
            }
          }
          mySlots.sort((a,b)=>b.slotFreq-a.slotFreq);
          // pct = probability of REACHING this round (sum of slot appearance frequencies)
          // not teamRoundData which counts advancements (wins), not appearances
          const pct=mySlots.reduce((sum,s)=>sum+s.slotFreq,0);
          return {rnd,pct,slots:mySlots};
        });
        return {teamGroup,groupObj,roundInfo};
      },[trackTeam,teamSlotData,simData]);

      // Venue finder
      const venueData=useMemo(()=>{
        if(!venueFilter)return null;
        const gsMatches=[];
        for(const[grp,matches]of Object.entries(GS)){
          for(const m of matches){
            if(m.venue===venueFilter) gsMatches.push({...m,group:grp});
          }
        }
        const koMatches=[];
        const roundKeys=["r32","r16","qf","sf","final"];
        for(const rnd of roundKeys){
          const slots=KO[rnd]||[];
          slots.forEach((slot,idx)=>{
            if(slot.venue===venueFilter){
              // find the correct global idx
              let globalIdx=idx;
              const rows=getSlotRows(rnd,globalIdx);
              koMatches.push({...slot,rnd,idx:globalIdx,rows});
            }
          });
        }
        return {gsMatches,koMatches};
      },[venueFilter,simData]);

        {id:"r16",label:"Round of 16"},
        {id:"qf",label:"Quarterfinals"},

                  </div>
                  <h1 style={{fontSize:"clamp(16px,4vw,24px)",fontWeight:800,color:"#f1f5f9",lineHeight:1.2,marginBottom:8}}>

                  </h1>
                  {!done?(

                      </div>
                      <span style={{color:"#60a5fa",fontSize:12}}>Running {progress.toLocaleString()} / {N.toLocaleString()} sims…</span>
                    </div>
                  ):(
                    <div className="header-sim-done" style={{color:"#4ade80",fontSize:12,fontWeight:600}}>✓ {N.toLocaleString()} simulations complete</div>
                  )}
                </div>
                <div className="header-actions" style={{display:"flex",flexDirection:"column",alignItems:"flex-end",gap:6,marginLeft:12}}>
                  <a className="header-back-link" href="https://debangandey.rbind.io" style={{
                    color:"#60a5fa",fontSize:12,textDecoration:"none",
                    background:"#0d1f3c",border:"1px solid #1e3a5f",
                    padding:"6px 12px",borderRadius:8,whiteSpace:"nowrap",
                    display:"inline-block",
                  }}>← debangandey.rbind.io</a>
                  <button className="theme-toggle-btn" onClick={()=>setDarkMode(d=>!d)}>
                    {darkMode ? '☀️ Light' : '🌙 Dark'}
                  </button>
                </div>
              </div>
            </div>
          </div>

          {/* MOBILE DROPDOWN NAV */}
          <div className="mobile-tab-dropdown">
            <select value={tab} onChange={e=>setTab(e.target.value)}>
              {tabs.map(t=>(
                <option key={t.id} value={t.id}>{t.label}</option>
              ))}
            </select>
          </div>

          {/* BODY ROW: sidebar + main */}
          <div className="body-row" style={{display:"flex",flex:1,overflow:"hidden",minHeight:0}}>

            {/* SIDEBAR NAV */}
            <nav className="sidebar-nav">
              {tabs.map(t=>(
                <button key={t.id} className={`sidebar-tab${tab===t.id?" active":""}`}
                  onClick={()=>setTab(t.id)}>
                  {t.label}
                </button>
              ))}
            </nav>

            {/* MAIN SCROLL AREA */}
            <div style={{flex:1,minWidth:0,overflowY:"auto"}}>

              {/* MAP — compact */}
              <div ref={mapDivRef} id="wc-map" style={{width:"100%",height:250,borderBottom:"1px solid #1e3a5f"}} />

          {/* VENUE PANEL — shows when a pin is clicked, full width */}
          {selectedMapVenue && (()=>{
            const vType=venueType(selectedMapVenue);
            const isTexas=vType==="texas";
            const isCanada=vType==="canada";
            const isMexico=vType==="mexico";
            const accentColor=isTexas?"#f59e0b":isCanada?"#22c55e":isMexico?"#f97316":"#3b82f6";

            // Group stage matches at this venue
            const gsMatches=[];
            for(const[grp,matches]of Object.entries(GS)){
              for(const m of matches){
                if(m.venue===selectedMapVenue) gsMatches.push({...m,group:grp});
              }
            }

            // KO matches at this venue
            const koMatches=[];
            for(const[rnd,slots]of Object.entries(KO)){
              slots.forEach((slot,idx)=>{
                if(slot.venue===selectedMapVenue){
                  const rows=getSlotRows(rnd,idx);
                  koMatches.push({...slot,rnd,idx,rows});

            // Trip cost if homeCity set

            if(homeCity){
              const vc=VENUE_COORDS[selectedMapVenue];
              if(vc){
                const dist=Math.round(haversine(homeCity.lat,homeCity.lng,vc.lat,vc.lng));
                const tc=travelCost(dist);

                const roundForHotel=tripRound||"group";

                      {isMexico&&<span style={{background:"#1c0a00",color:"#f97316",padding:"2px 10px",borderRadius:12,fontSize:11,fontWeight:700}}>🇲🇽 Mexico</span>}
                      <span style={{color:"#64748b",fontSize:12}}>{gsMatches.length} group · {koMatches.length} knockout matches</span>
                    </div>
                    <button onClick={()=>setSelectedMapVenue(null)} style={{
                      background:"transparent",border:"1px solid #1e3a5f",color:"#64748b",
                      borderRadius:6,padding:"4px 10px",fontSize:12,cursor:"pointer"
                    }}>✕ Close</button>
                  </div>

                  {/* Trip cost mini-panel */}
                  {tripInfo&&(
                    <div style={{
                      background:"#050e20",border:"1px solid #1e3a5f",borderRadius:8,
                      padding:"10px 14px",marginBottom:12,

                        <span style={{color:"#64748b",fontSize:12,fontWeight:700}}>FROM {homeCity.n.toUpperCase()}</span>
                        <span style={{color:"#94a3b8",fontSize:12}}>{tripInfo.dist.toLocaleString()} mi · {tripInfo.tc.mode}</span>
                        <span style={{color:"#60a5fa",fontSize:12}}>Travel: <b>${tripInfo.tc.low}–${tripInfo.tc.high}</b></span>
                        <span style={{color:"#a78bfa",fontSize:12}}>Hotel/night: <b>${tripInfo.hc.low}–${tripInfo.hc.high}</b>
                          {tripInfo.hotelRoundLabel&&<span style={{color:"#475569",fontSize:10,marginLeft:4}}>{tripInfo.hotelRoundLabel}</span>}
                        </span>
                        {prices?.tiers&&(()=>{

                          const tk=(prices?.tickets?.[selectedMapVenue]?.[tier])

                          const totalLow=tripInfo.tc.low+tripInfo.hc.low+tk.low;

                        })()}
                      </div>
                      {tripInfo.tc.mode.includes("✈️")&&(
                        <FlightsButton fromCity={homeCity.n.split(",")[0]} toCity={tripInfo.venueCity}/>
                      )}
                    </div>
                  )}

                  {/* Group stage matches */}
                  {gsMatches.length>0&&(
                    <div style={{marginBottom:12}}>
                      <div style={{color:"#64748b",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Group Stage</div>
                      {gsMatches.map((m,i)=>(
                        <div key={i} style={{
                          display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",
                          padding:"6px 10px",background:"#050e20",borderRadius:7,marginBottom:4,
                          border:"1px solid #1e3a5f"
                        }}>
                          <span style={{background:"#1e3a5f",color:"#a78bfa",padding:"1px 8px",borderRadius:10,fontSize:11,fontWeight:700}}>Grp {m.group}</span>
                          <span style={{color:"#64748b",fontSize:12}}>{m.date}</span>
                          <span style={{fontSize:14,fontWeight:600}}>{fl(m.a)} {m.a}</span>
                          <span style={{color:"#475569",fontSize:12}}>vs</span>
                          <span style={{fontSize:14,fontWeight:600}}>{fl(m.b)} {m.b}</span>
                        </div>
                      ))}
                      <PriceBadge tier="group" venue={selectedMapVenue} prices={prices}/>
                    </div>
                  )}

                  {/* Knockout matches */}
                  {koMatches.length>0&&(
                    <div>
                      <div style={{color:"#64748b",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Knockout Matches</div>
                      {koMatches.map((m,i)=>(
                        <div key={i} style={{marginBottom:8}}>
                          <SlotCard slot={m} rows={m.rows} N={N} tier={m.rnd} prices={prices}/>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            );
          })()}

              {/* TAB CONTENT */}
              <div className="main-content-pad" style={{maxWidth:tab==="bracket"?1700:860,padding:"16px 24px 40px"}}>

            {/* =============== GUIDE TAB =============== */}
            {tab==="guide"&&(
              <div>
                <h2 style={{fontSize:18,fontWeight:700,color:"#f1f5f9",marginBottom:4}}>📖 How to Use This Simulator</h2>
                <p style={{color:"#64748b",fontSize:13,marginBottom:24}}>
                  A Monte Carlo bracket predictor for FIFA World Cup 2026 — run {N.toLocaleString()} simulated tournaments and explore what's likely, what's possible, and what it costs to be there.
                </p>

                {[
                  {
                    icon:"⚙️",title:"How the simulation works",
                    body:"Each simulation runs the full tournament — group stage through the Final — using Elo strength ratings to calculate win probabilities for every match. Ratings come from eloratings.net (January 2026 snapshot) and reflect each team's full match history. Host nations (USA, Mexico, Canada) receive a small home-advantage bonus. Stronger teams win more often, but upsets happen. After 50,000 runs, the percentages shown are how often each outcome actually occurred."
                  },
                  {
                    icon:"🏆",title:"Champion Odds",
                    body:"Shows each team's championship probability broken into three tiers: Top Favorites (>8%), Strong Contenders (3–8%), and Dark Horses (<3%). The bar length reflects relative likelihood. Use this as a quick power ranking — teams near the top of Dark Horses are your classic 'upset watch' picks."
                  },
                  {
                    icon:"🏟️",title:"Group Stage & Knockout Round tabs",
                    body:"Group Stage shows all 12 groups with projected qualifiers highlighted. The Round of 32 through Final tabs show each match slot's top 3 most likely matchups, their probability, and the expected win split. Gold/silver/bronze medals rank the matchups by frequency. Match quality labels (Elite Clash, Upset Alert, Even Contest…) are based on the relative ELO gap between the two teams — not just raw strength."
                  },
                  {
                    icon:"🔍",title:"Track a Team",
                    body:"Pick any of the 48 qualified nations. You'll see their group, ELO rating, FIFA rank, form rating, and a round-by-round probability breakdown of how far they're likely to go. Each round shows which slot(s) they're likely to play in, the venue, and their most probable opponents — drawn only from actual simulated head-to-head pairings, so same-group teammates never appear as knockout opponents."
                  },
                  {
                    icon:"📍",title:"Venue Finder",
                    body:"Search by city or stadium name to see every match scheduled at that venue across all rounds. Useful if you're planning to attend games at a specific location and want to know which teams are likely to play there."

                          <p style={{color:'#64748b',fontSize:12,marginBottom:12}}>Pick 1st and 2nd place for each group.</p>

                            <GroupPicker key={g} letter={g} group={GROUPS[g]}
                              stats={groupQualStats} showModel={sbAbGroup==='model'} picks={groupPicks[g]||{}} onChange={p=>{
                                const newGP={...groupPicks,[g]:p};
                                setGroupPicks(newGP);
                                const qualified=new Set(Object.values(newGP).flatMap(pk=>[pk.first,pk.second]).filter(Boolean));
                                setThirdPicks(prev=>prev.filter(tp=>!qualified.has(tp.team)));
                              }} />
                          ))}
                          <div style={{display:'flex',justifyContent:'space-between',marginTop:8}}>
                            <button style={navBtn} onClick={()=>setBStep(1)}>← Back</button>
                            <button style={{...navBtn,background:grpGLDone?'#3b82f6':'#0d1f3c',color:grpGLDone?'#fff':'#475569'}}

                      {bStep===3&&(()=>{

                          <div>

                                    {groupTaken&&<span style={{marginLeft:'auto',color:'#334155',fontSize:10}}>grp taken</span>}

                  {sbUser&&bracketLoading&&(

                  {/* ---- SAVED BRACKET VIEW ---- */}

                    const ta=assignUserThirds(savedBracket.thirds||[]);
                    const r32=buildUserR32(savedBracket.gp||{},ta);
                    const ko=savedBracket.ko||{};
                    const displayName=sbDisplayName||sbUser?.email?.split('@')[0]||'My Bracket';
                    // Shared helper: renders bracket SVG → PNG blob
                    const getBracketBlob=()=>new Promise((resolve,reject)=>{
                      const svgEl=document.getElementById('bracket-svg');
                      if(!svgEl){reject(new Error('SVG not found'));return;}
                      const svgData=new XMLSerializer().serializeToString(svgEl);
                      const img=new Image();
                      img.onload=()=>{
                        const c=document.createElement('canvas');
                        c.width=3920; c.height=1920;
                        const ctx=c.getContext('2d');
                        ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,c.width,c.height);
                        ctx.drawImage(img,0,0,c.width,c.height);
                        c.toBlob(blob=>{
                          if(blob)resolve(blob); else reject(new Error('Canvas toBlob failed'));
                        },'image/png');
                      };
                      img.onerror=reject;

                          await navigator.share({files:[file],title:'My WC 2026 Bracket',text:shareText});

                          const url=URL.createObjectURL(blob);
                          const a=document.createElement('a');

                              background:'#061228',border:'1px solid #1e3a5f',borderRadius:8,

                      </div>

                        const catBlock=(ic,lb,d)=>(

                              </div>
                              <div style={{display:'flex',flexWrap:'wrap',gap:4,marginTop:5}}>

                                background:darkMode?'#1e3a5f':'#0f172a',

                                padding:'5px 10px',cursor:'pointer',
                                whiteSpace:'nowrap',flexShrink:0,lineHeight:1.3,fontWeight:600,
                              }}>📋 View</button>

                    <div style={{marginTop:12,background:darkMode?'#040d1c':'#f8fafc',

                  {/* ---- BRACKET VIEW MODAL ---- */}
                  {viewBracket&&(
                    <div onClick={e=>{if(e.target===e.currentTarget)setViewBracket(null);}} style={{
                      position:'fixed',inset:0,background:'rgba(0,0,0,0.85)',zIndex:1000,
                      display:'flex',alignItems:'center',justifyContent:'center',padding:16,
                    }}>
                      <div style={{
                        background:darkMode?'#061228':'#ffffff',
                        border:`1px solid ${darkMode?'#1e3a5f':'#e2e8f0'}`,

                      }}>

                        ):(()=>{
                          const p=viewBracket.picks;
                          const champion=p.final[0];
                          const sfVals=Object.values(p.sf).filter(Boolean);
                          const finalist=sfVals.find(t=>t&&t!==champion);
                          const dk=darkMode;
                          // Three-tier pill system: champion (gold), finalist (blue), other (neutral)
                          const Pill=({team,tier='other'})=>{
                            const S={
                              champion:{bg:dk?'#451a03':'#fffbeb',bd:'#d97706',txt:dk?'#fbbf24':'#92400e',fw:800,sz:13},
                              finalist:{bg:dk?'#1e3a5f':'#dbeafe',bd:'#3b82f6',txt:dk?'#93c5fd':'#1d4ed8',fw:700,sz:12},
                              other:   {bg:dk?'#0d1f3c':'#f1f5f9',bd:dk?'#1e3a5f':'#e2e8f0',txt:dk?'#cbd5e1':'#374151',fw:400,sz:12},
                            };
                            const s=S[tier]||S.other;
                            return (
                              <span style={{background:s.bg,border:`1.5px solid ${s.bd}`,borderRadius:20,
                                padding:'4px 11px 4px 8px',fontSize:s.sz,color:s.txt,fontWeight:s.fw,

                                <span style={{fontSize:15,lineHeight:1}}>{fl(team)}</span>

                            );

                          const SecHdr=({label,accent})=>(

                            </div>
                          );
                          const Section=({label,slots,accent})=>{
                            const teams=Object.keys(slots).sort((a,b)=>Number(a)-Number(b)).map(k=>slots[k]).filter(Boolean);

                            const ac=accent||'#64748b';
                            return (

                                      tier={t===champion?'champion':t===finalist?'finalist':'other'}/>

                                </div>
                              </div>
                            );
                          };
                          const ALPHA='ABCDEFGHIJKL';
                          const grpRows=ALPHA.split('').map((g,i)=>({g,first:p.grp1[i],second:p.grp2[i]})).filter(r=>r.first||r.second);
                          const grpTTeams=Object.values(p.grpT).filter(Boolean).map(t=>t.includes(':')?t.split(':')[1]:t);

                                  </div>
                                </div>

                                    <Pill team={finalist} tier='finalist'/>

                      <div style={{color:"#475569",fontSize:11,marginBottom:6}}>Quick pick:</div>
                      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                        {["New York, NY","Los Angeles, CA","Chicago, IL","Houston, TX","Miami, FL",
                          "Dallas, TX","Seattle, WA","Boston, MA","Atlanta, GA","Toronto, ON",
                          "Vancouver, BC","Mexico City, MX"].map(cn=>{
                          const city=HOME_CITIES.find(c=>c.n===cn);
                          if(!city)return null;
                          return(
                            <button key={cn}
                              onClick={()=>{setHomeCity(city);setCityInput(city.n);setCityError(null);}}
                              style={{
                                background:"#061228",border:"1px solid #1e3a5f",color:"#94a3b8",
                                borderRadius:20,padding:"4px 12px",fontSize:11,cursor:"pointer",

                          );
                        })}
                      </div>
                    </div>
                  )}
                </div>

                <div style={{marginBottom:20}}>
                  <div style={{color:"#64748b",fontSize:11,fontWeight:700,marginBottom:4}}>ROUND TO ATTEND</div>
                  <select value={tripRound} onChange={e=>setTripRound(e.target.value)} style={{
                    background:"#0d1f3c",border:"1px solid #1e3a5f",color:"#e2e8f0",
                    borderRadius:8,padding:"10px 16px",fontSize:14,cursor:"pointer",outline:"none"
                  }}>
                    <option value="group">Group Stage</option>
                    <option value="r32">Round of 32</option>
                    <option value="r16">Round of 16</option>
                    <option value="qf">Quarterfinals</option>
                    <option value="sf">Semifinals</option>
                    <option value="final">Final</option>
                  </select>
                </div>

                {homeCity?(()=>{
                  const DAY_TRIP_MILES=180;

                  // ── Build a row for every individual match in the selected round ──
                  const allMatchRows=[];

                  if(tripRound==="group"){
                    for(const[grp,matches] of Object.entries(GS)){
                      for(const m of matches){
                        const vc=VENUE_COORDS[m.venue];
                        if(!vc)continue;
                        const isoDate=toISO(m.date);
                        const matchKey=`${isoDate}|${m.venue}`;
                        const eloA=ELO[m.a]||1300, eloB=ELO[m.b]||1300;
                        const sumElo=eloA+eloB;
                        const tk=prices?.matches?.[matchKey]
                               ||prices?.tiers?.group
                               ||{low:150,high:700};
                        const dist=Math.round(haversine(homeCity.lat,homeCity.lng,vc.lat,vc.lng));
                        const isDayTrip=dist<DAY_TRIP_MILES;
                        const tc=travelCost(dist);
                        const hcRaw=prices?.hotels?.[m.venue]?.group||HOTEL_COST[m.venue]||{low:150,high:400};
                        const hc=isDayTrip?{low:0,high:50}:hcRaw;
                        const totalLow=tc.low+hc.low+tk.low;
                        const totalHigh=tc.high+(isDayTrip?hc.high:hc.high*2)+tk.high;
                        allMatchRows.push({
                          t1:m.a,t2:m.b,date:m.date,isoDate,venue:m.venue,group:grp,
                          certain:true,pct:null,altMatchups:[],
                          eloA,eloB,sumElo,matchKey,tk,tc,hc,isDayTrip,dist,totalLow,totalHigh,
                          venueCity:vc.city||m.venue,
                        });
                      }
                    }
                  } else {
                    (KO[tripRound]||[]).forEach((sl,idx)=>{
                      const vc=VENUE_COORDS[sl.venue];
                      if(!vc)return;
                      const isoDate=toISO(sl.date);
                      const matchKey=`${isoDate}|${sl.venue}`;
                      // Parse numeric match ID from slot label e.g. "M87" → 87
                      const matchNum=sl.m?parseInt(sl.m.replace(/^M/,""),10):null;
                      const counts=simData[tripRound]?.[idx]||{};
                      const sorted=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
                      let t1="TBD",t2="TBD",pct=null,sumElo=2800;
                      if(sorted.length){
                        const[key,cnt]=sorted[0];
                        [t1,t2]=key.split("|");
                        pct=Math.round((cnt/N)*100);
                        // Probability-weighted sum ELO across top matchups
                        let wElo=0,wSum=0;
                        for(const[k,c] of sorted.slice(0,6)){
                          const[ta,tb]=k.split("|");
                          const w=c/N;
                          wElo+=w*((ELO[ta]||1300)+(ELO[tb]||1300));
                          wSum+=w;
                        }
                        sumElo=wSum>0?wElo/wSum:2800;
                      }
                      const altMatchups=sorted.slice(1,4).map(([k,c])=>{
                        const[ta,tb]=k.split("|");
                        return{ta,tb,pct:Math.round((c/N)*100)};
                      });
                      // Ticket lookup: match number (most precise) → date+venue → global tier
                      const tk=(matchNum&&prices?.matchById?.[matchNum])
                             ||prices?.matches?.[matchKey]
                             ||prices?.tiers?.[tripRound]
                             ||{low:200,high:900};
                      const dist=Math.round(haversine(homeCity.lat,homeCity.lng,vc.lat,vc.lng));
                      const isDayTrip=dist<DAY_TRIP_MILES;
                      const tc=travelCost(dist);
                      const hcRaw=prices?.hotels?.[sl.venue]?.[tripRound]
                                ||prices?.hotels?.[sl.venue]?.group
                                ||HOTEL_COST[sl.venue]||{low:150,high:400};
                      const hc=isDayTrip?{low:0,high:50}:hcRaw;
                      const totalLow=tc.low+hc.low+tk.low;
                      const totalHigh=tc.high+(isDayTrip?hc.high:hc.high*2)+tk.high;
                      const eloA=ELO[t1]||sumElo/2, eloB=ELO[t2]||sumElo/2;
                      allMatchRows.push({
                        t1,t2,date:sl.date,isoDate,venue:sl.venue,slotM:sl.m,
                        certain:false,pct,altMatchups,
                        eloA,eloB,sumElo,matchKey,matchNum,tk,tc,hc,isDayTrip,dist,totalLow,totalHigh,
                        venueCity:vc.city||sl.venue,
                      });
                    });
                  }

                  // Best match score: quality × affordability
                  // Label scores compressed so ELO (~1300–1877) is a meaningful co-contributor.
                  // typicalCost = 85% weight on low end + 15% on high — penalises astronomical
                  // ticket ceilings (e.g. $82k for Morocco–Netherlands) even when the low is cheap.
                  // Soft penalty: quality × 2000/(2000+cost), so a $2k trip costs ~half the score.
                  const LABEL_SCORE={"Elite clash":500,"Top match":400,"Upset alert":380,"Even contest":350,"Competitive":250,"Heavy favorite":150,"Underdog battle":120,"Underdog clash":90,"Mismatch":40};
                  const qScore=r=>{
                    const{label}=matchLabel(r.eloA,r.eloB);
                    const raw=(LABEL_SCORE[label]||0)+(r.eloA+r.eloB)/2;
                    const typicalCost=r.totalLow+(r.totalHigh-r.totalLow)*0.15;
                    return raw*2000/(2000+typicalCost);

                  const sorted=[...allMatchRows].sort((a,b)=>
                    tripSort==="cost"?(a.totalLow-b.totalLow):(qScore(b)-qScore(a))
                  );
                  const top3=sorted.slice(0,3);
                  const MEDAL=["#1","#2","#3"];

                  const ROUND_LABEL={group:"Group Stage",r32:"Round of 32",r16:"Round of 16",qf:"Quarterfinals",sf:"Semifinals",final:"Final"};

                  return (
                    <div>
                      {/* ── Prices load warning ── */}
                      {pricesError&&(

                        </div>
                      )}
                      {/* ── Header + sort toggle ── */}
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,marginBottom:16}}>
                        <div style={{color:"#94a3b8",fontSize:13}}>
                          Top 3 <b style={{color:"#f1f5f9"}}>{tripSort==="quality"?"highest-quality":"cheapest"}</b> {ROUND_LABEL[tripRound]} matches from <b style={{color:"#f1f5f9"}}>{homeCity.n}</b>
                        </div>
                        <div style={{display:"flex",gap:4}}>
                          {[["quality","⭐ Best Match"],["cost","💰 Cheapest"]].map(([v,lbl])=>(
                            <button key={v} onClick={()=>setTripSort(v)} style={{
                              background:tripSort===v?"#1e3a5f":"transparent",
                              border:`1px solid ${tripSort===v?"#3b82f6":"#1e3a5f"}`,
                              color:tripSort===v?"#93c5fd":"#64748b",
                              borderRadius:20,padding:"4px 12px",fontSize:11,
                              cursor:"pointer",fontWeight:tripSort===v?700:400,
                            }}>{lbl}</button>
                          ))}
                        </div>
                      </div>

                      {top3.map((row,i)=>{
                        const{t1,t2,date,venue,group,certain,pct,altMatchups,
                              eloA,eloB,sumElo,tk,tc,hc,isDayTrip,dist,totalLow,totalHigh,venueCity}=row;
                        const{label:matchLbl,color:matchColor,stars}=matchLabel(eloA,eloB);
                        const totalColor=totalLow<600?"#4ade80":totalLow<1200?"#fbbf24":"#f87171";
                        const vt=venueType(venue);
                        const showFlight=tc.mode.includes("✈️");
                        const isSelected=venue===selectedMapVenue;
                        const hasLiveTicket=!!(
                          (row.matchNum&&prices?.matchById?.[row.matchNum])
                          ||prices?.matches?.[row.matchKey]
                        );

                        return (
                          <div key={`${row.isoDate}-${venue}`} style={{
                            background:isSelected?"#0a1f3f":"#050e20",
                            border:`2px solid ${isSelected?"#3b82f6":"#1e3a5f"}`,
                            borderRadius:12,padding:"14px 16px",marginBottom:12,
                            transition:"all 0.15s",
                          }}>
                            {/* ── Match quality + medal header ── */}
                            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,flexWrap:"wrap",gap:6}}>
                              <div style={{display:"flex",alignItems:"center",gap:8}}>
                                <span style={{fontSize:11,fontWeight:700,color:'#60a5fa',
                                  background:'#1e3a5f',borderRadius:4,padding:'2px 6px'}}>{MEDAL[i]}</span>
                                {/* Quality stars */}
                                <span style={{color:matchColor,fontSize:15,letterSpacing:1}}>
                                  {"★".repeat(stars)}{"☆".repeat(5-stars)}
                                </span>
                                <span style={{
                                  background:"#0d1f3c",border:`1px solid ${matchColor}`,
                                  color:matchColor,fontSize:10,fontWeight:700,
                                  padding:"2px 8px",borderRadius:10,
                                }}>
                                  {matchLbl}
                                </span>
                                {hasLiveTicket&&(
                                  <span style={{
                                    background:"#052e16",border:"1px solid #166534",
                                    color:"#4ade80",fontSize:10,fontWeight:700,
                                    padding:"2px 8px",borderRadius:10,
                                  }}>🎟️ Live price</span>
                                )}
                              </div>
                              <span style={{color:"#334155",fontSize:11}}>{date}</span>
                            </div>

                            {/* ── Teams ── */}
                            <div
                              onClick={()=>{setSelectedMapVenue(venue);window.scrollTo({top:0,behavior:"smooth"});}}
                              style={{cursor:"pointer"}}
                            >
                              <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:6}}>
                                <span style={{fontSize:17,fontWeight:700,color:"#f1f5f9"}}>
                                  {t1!=="TBD"?`${fl(t1)} ${t1}`:"TBD"}
                                  <span style={{color:"#475569",fontSize:12,margin:"0 4px"}}>#{RANKS[t1]||"–"}</span>
                                </span>
                                <span style={{color:"#475569",fontSize:14,fontWeight:600}}>vs</span>
                                <span style={{fontSize:17,fontWeight:700,color:"#f1f5f9"}}>
                                  {t2!=="TBD"?`${fl(t2)} ${t2}`:"TBD"}
                                  <span style={{color:"#475569",fontSize:12,margin:"0 4px"}}>#{RANKS[t2]||"–"}</span>
                                </span>
                                {certain&&group&&<span style={{color:"#64748b",fontSize:11,background:"#0d1f3c",padding:"1px 8px",borderRadius:10}}>Group {group}</span>}
                                {!certain&&pct!==null&&(
                                  <span style={{background:"#1e3a5f",color:"#93c5fd",fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:10}}>
                                    {pct}% likely
                                  </span>
                                )}
                              </div>

                              {/* Alt matchups for KO */}
                              {!certain&&altMatchups.length>0&&done&&(
                                <div style={{color:"#334155",fontSize:11,marginBottom:6}}>
                                  <span style={{color:"#475569",marginRight:4}}>Also possible:</span>
                                  {altMatchups.map((m,j)=>(
                                    <span key={j} style={{marginRight:10}}>
                                      {fl(m.ta)}{fl(m.tb)} {m.pct}%
                                    </span>
                                  ))}
                                </div>
                              )}
                              {!certain&&!done&&<div style={{color:"#334155",fontSize:11,marginBottom:6}}>Sim running…</div>}

                              {/* ── Venue + distance ── */}
                              <div style={{
                                display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",
                                padding:"7px 0",borderTop:"1px solid #0d1f3c",borderBottom:"1px solid #0d1f3c",
                                margin:"6px 0",
                              }}>
                                <span style={{color:"#64748b",fontSize:12,fontWeight:600}}>📍 {venue}</span>
                                {isDayTrip&&<span style={{background:"#052e16",color:"#4ade80",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:10,border:"1px solid #166534"}}>🚗 Day trip</span>}
                                {vt==="canada"&&<span style={{color:"#22c55e",fontSize:11}}>🍁 Canada</span>}
                                {vt==="mexico"&&<span style={{color:"#f97316",fontSize:11}}>🇲🇽 Mexico</span>}
                                <span style={{color:"#475569",fontSize:11,marginLeft:"auto"}}>{dist.toLocaleString()} mi · {tc.mode}</span>
                              </div>

                              {/* ── Cost breakdown ── */}
                              <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginTop:8}}>
                                <span style={{color:totalColor,fontWeight:800,fontSize:16,marginRight:4}}>
                                  ${totalLow.toLocaleString()}–${totalHigh.toLocaleString()}
                                </span>
                                <span style={{background:"#0d1f3c",border:"1px solid #1e3a5f",color:"#93c5fd",fontSize:11,padding:"2px 8px",borderRadius:20}}>
                                  ✈️ ${tc.low}–${tc.high}
                                </span>
                                <span style={{background:"#0d1f3c",border:"1px solid #1e3a5f",color:isDayTrip?"#4ade80":"#fcd34d",fontSize:11,padding:"2px 8px",borderRadius:20}}>
                                  {isDayTrip?"🚗 No hotel":`🏨 $${hc.low}–$${hc.high}/nt`}
                                </span>
                                <span style={{background:"#0d1f3c",border:`1px solid ${hasLiveTicket?"#166534":"#1e3a5f"}`,color:"#c4b5fd",fontSize:11,padding:"2px 8px",borderRadius:20}}>
                                  🎟️ ${tk.low}–${tk.high}
                                </span>
                              </div>
                            </div>

                            {/* Flight link */}
                            {showFlight&&(
                              <div onClick={ev=>ev.stopPropagation()} style={{marginTop:10}}>
                                <FlightsButton fromCity={homeCity.n.split(",")[0]} toCity={venueCity}/>
                              </div>
                            )}
                          </div>
                        );
                      })}

                      {sorted.length>3&&(
                        <div style={{color:"#334155",fontSize:11,textAlign:"center",padding:"6px 0"}}>
                          +{sorted.length-3} more {ROUND_LABEL[tripRound]} matches available — click any map pin to explore a venue
                        </div>
                      )}
                      <div style={{color:"#334155",fontSize:11,marginTop:10}}>
                        * Quality ★ = avg ELO of both teams. Day trip = within {DAY_TRIP_MILES} mi. All costs estimated. 🎟️ Live price = real VividSeats listing.
                      </div>
                    </div>
                  );
                })():(
                  <div style={{color:"#475569",textAlign:"center",padding:"40px 0",fontSize:14}}>
                    Select your home city above to see the best matches to attend
                  </div>
                )}
              </div>
            )}

            {/* =============== FIFA RANKINGS TAB =============== */}
            {tab==="rankings"&&(
              <div>
                <h2 style={{fontSize:18,fontWeight:700,color:"#f1f5f9",marginBottom:4}}>📊 FIFA World Rankings</h2>
                <p style={{color:"#64748b",fontSize:13,marginBottom:20}}>All 48 qualified teams ranked by official FIFA ranking (April 2026)</p>
                <div style={{display:"grid",gap:5}}>
                  {SORTED_BY_FIFA.map(([t,info])=>{
                    const f=FORM[t]||0;
                    const barW=(info.points/MAX_FIFA_POINTS)*100;
                    const teamColor=COLORS[t]||"#334155";
                    return (
                      <div key={t} style={{
                        background:"#061228",border:"1px solid #1e3a5f",
                        borderRadius:8,padding:"8px 12px",
                        display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"
                      }}>
                        <span style={{color:"#475569",fontSize:12,minWidth:28,textAlign:"right"}}>#{info.rank}</span>
                        <span style={{fontSize:20}}>{fl(t)}</span>
                        <div style={{flex:1,minWidth:120}}>
                          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3,flexWrap:"wrap"}}>
                            <span style={{fontWeight:600,fontSize:13}}>{t}</span>
                            <span style={{
                              color:fc(f),fontSize:11,fontWeight:700,
                              background:"#0d1f3c",padding:"1px 6px",borderRadius:10
                            }}>{fa(f)}</span>
                          </div>
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <div style={{flex:1,height:6,background:"#0d1f3c",borderRadius:3,overflow:"hidden"}}>
                              <div style={{width:`${barW}%`,height:"100%",background:teamColor,borderRadius:3}}/>
                            </div>
                            <span style={{color:"#60a5fa",fontSize:12,fontWeight:700,minWidth:56,textAlign:"right"}}>{info.points.toFixed(1)} pts</span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* =============== GROUP STAGE TAB =============== */}
            {tab==="groups"&&(
              <div>
                <h2 style={{fontSize:18,fontWeight:700,color:"#f1f5f9",marginBottom:4}}>🏟️ Group Stage</h2>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16,flexWrap:"wrap"}}>
                  <p style={{color:"#64748b",fontSize:13,margin:0}}>Live standings: Groups A–F finalized (MD3). Groups G–L after MD2 (MD3 plays Jun 26–27). Remaining games simulated.</p>
                  <span style={{
                    background:"#0f3024",color:"#4ade80",
                    padding:"2px 10px",borderRadius:12,fontSize:11,fontWeight:700,flexShrink:0
                  }}>🔴 LIVE DATA</span>
                </div>
                {Object.entries(GROUPS).map(([letter,g])=>(
                  <GroupCard key={letter} letter={letter} g={g} />
                ))}
              </div>
            )}

            {/* =============== 3RD PLACE RACE TAB =============== */}
            {tab==="thirds"&&(()=>{
              const WIN_SLOT={A:10,B:14,C:8,D:6,E:0,F:3,G:7,H:5,I:1,J:12,K:15,L:11};
              const RU_SLOT ={A:2,B:2,C:3,D:13,E:9,F:8,G:13,H:12,I:9,J:5,K:4,L:4};
              const TIDX={0:"M74",1:"M77",6:"M81",7:"M82",10:"M79",11:"M80",14:"M85",15:"M87"};
              const TOPP={M74:"vs W-E",M77:"vs W-I",M79:"vs W-A",M80:"vs W-L",M81:"vs W-D",M82:"vs W-G",M85:"vs W-B",M87:"vs W-K"};
              const r32s=teamSlotData.r32||{};
              const tg={};
              for(const[g,go]of Object.entries(GROUPS))for(const t of go.teams)tg[t]=g;
              function topSlot(team){
                const g=tg[team],ws=WIN_SLOT[g],rs=RU_SLOT[g];
                let best=null,bestC=0;
                for(const[si,teams]of Object.entries(r32s)){
                  const i=Number(si);
                  if(i!==ws&&i!==rs&&TIDX[i]){const c=teams[team]||0;if(c>bestC){bestC=c;best=TIDX[i];}}
                }
                return best;
              }
              // Build per-team candidates
              // Teams confirmed eliminated as 4th place — never appear in 3rd place race
              const ELIM4=new Set(['Czechia','Qatar','Haiti','Turkey','Tunisia','Panama','Jordan','Curacao']);
              const rawCandidates=Object.entries(groupQualStats)
                .filter(([t,s])=>s.third>0&&!ELIM4.has(t))
                .sort((a,b)=>b[1].third-a[1].third);
              // Merge same-group teams: only one can be 3rd from any group, so collapse
              // them into a single row showing both names (mutually exclusive events)
              const seenGrp={};
              const merged=[];
              for(const[team,s]of rawCandidates){
                const g=tg[team];
                if(seenGrp[g]!==undefined){
                  // Add as alternate to the primary entry
                  merged[seenGrp[g]].alt={team,s};
                } else {
                  seenGrp[g]=merged.length;
                  merged.push({team,s,g,alt:null});
                }
              }
              // Tier the 12 group-thirds by qualification CERTAINTY, not by a hard
              // 8th-place line — so teams genuinely competing for the same remaining
              // spot(s) sit together and near-ties aren't split into in/out.
              const THROUGH_MIN=80, LONGSHOT_MAX=12;  // % thresholds: ~locked / near-eliminated
              const through=[],contested=[],longshot=[];
              for(const e of merged){
                const p=e.s.third;
                if(p>=THROUGH_MIN) through.push(e);
                else if(p>=LONGSHOT_MAX) contested.push(e);
                else if(p>=1) longshot.push(e);
              }
              const spotsLeft=Math.max(0,8-through.length);  // spots the contested teams fight for
              const maxT=merged[0]?.s.third||1;
              function barColor(tier){
                if(tier==='through')return"#22c55e";
                if(tier==='contested')return"#f59e0b";
                return"#475569";
              }
              function ThirdEntry({entry,rank,tier}){
                const{team,s,g,alt}=entry;
                const live=LIVE_STANDINGS[g];
                const md=live?.md||0;
                const pts=live?.pts?.[team]??null;
                const gd=live?.gd?.[team]??null;
                const slot=topSlot(team);
                // Bar shows the team's own 3rd-place chance; the line below adds its
                // TOTAL chance of advancing (group win / runner-up / 3rd).
                const barW=(s.third/maxT)*100;
                const bc=barColor(tier);
                // The group's other realistic qualifier — usually the runner-up favourite.
                const partner=alt&&alt.s.qual>=15?alt:null;
                // "≈" for contested (tied for the last spot), rank for clear qualifiers, "–" for long shots.
                const rankLabel=tier==='through'?`#${rank}`:tier==='contested'?'≈':'–';
                const rankColor=tier==='through'?'#22c55e':tier==='contested'?'#fbbf24':'#475569';
                const borderColor=tier==='through'?'#14532d':tier==='contested'?'#78350f':'#0d1f3c';
                return (
                  <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderRadius:8,marginBottom:5,background:"#061228",border:`1px solid ${borderColor}`,flexWrap:"wrap",opacity:tier==='out'?0.6:1}}>
                    <span style={{color:rankColor,fontSize:12,minWidth:22,textAlign:"right",fontWeight:700}}>{rankLabel}</span>
                    {/* flags */}
                    <span style={{fontSize:20,lineHeight:1}}>{fl(team)}</span>
                    <div style={{flex:1,minWidth:150}}>
                      <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:4,flexWrap:"wrap"}}>
                        <span style={{fontWeight:700,fontSize:13}}>{team}</span>
                        <span style={{background:"#0d1f3c",color:"#a78bfa",padding:"1px 6px",borderRadius:10,fontSize:10,fontWeight:700}}>Grp {g}</span>
                        {md>=3&&pts!==null&&(<span style={{background:"#0f3024",color:"#4ade80",padding:"1px 6px",borderRadius:10,fontSize:10,fontWeight:700}}>{pts}pts {gd>=0?"+":""}{gd}GD · locked 3rd</span>)}
                        {md===2&&pts!==null&&(<span style={{background:"#1e3a5f",color:"#bfdbfe",padding:"1px 6px",borderRadius:10,fontSize:10,fontWeight:600}}>{pts}pts {gd>=0?"+":""}{gd}GD (MD2)</span>)}
                      </div>
                      <div style={{display:"flex",alignItems:"center",gap:6}}>
                        <div style={{flex:1,height:7,background:"#0d1f3c",borderRadius:4,overflow:"hidden"}}>
                          <div style={{width:`${barW}%`,height:"100%",background:bc,borderRadius:4,transition:"width 0.5s"}}/>
                        </div>
                        <span style={{color:"#f1f5f9",fontWeight:800,fontSize:13,minWidth:40,textAlign:"right"}}>{s.third}%</span>
                      </div>
                      <div style={{fontSize:10,color:"#94a3b8",marginTop:3,fontWeight:600}}>
                        {md>=3
                          ? `🥉 ${s.third}% to claim one of the 8 third-place spots`
                          : `🥉 ${s.third}% as a 3rd · ✅ ${s.qual}% to advance any route${s.ru>=10?` (${s.ru}% as runner-up)`:""}`}
                      </div>
                      {partner&&(
                        <div style={{fontSize:10,color:"#7c93b0",marginTop:2}}>
                          Grp {g} also: {fl(partner.team)} {partner.team} — {partner.s.qual}% to advance{partner.s.ru>partner.s.third?" (mostly as runner-up)":""}
                        </div>
                      )}
                    </div>
                    {slot&&(
                      <div style={{background:"#0d1f3c",borderRadius:8,padding:"4px 10px",textAlign:"center",minWidth:64,flexShrink:0}}>
                        <div style={{color:"#60a5fa",fontSize:11,fontWeight:700}}>{slot}</div>
                        <div style={{color:"#475569",fontSize:9}}>{TOPP[slot]}</div>
                      </div>
                    )}
                  </div>
                );
              }
              return (
                <div>
                  <h2 style={{fontSize:18,fontWeight:700,color:"#f1f5f9",marginBottom:4}}>🥉 3rd Place Race</h2>
                  <p style={{color:"#64748b",fontSize:13,marginBottom:8}}>
                    {done?`8 of 12 third-placed teams advance. 🥉 = a group's chance of grabbing one of the 8 spots, ✅ = its total chance of advancing by ANY route. Teams whose qualification is still genuinely uncertain are grouped as "contested" — competing for the same remaining spot(s) — rather than split into a false in/out.`:"Simulations running — probabilities will appear when complete"}
                  </p>
                  {done&&(
                    <div>
                      <div style={{marginBottom:24}}>
                        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,borderBottom:"2px solid #22c55e",paddingBottom:6}}>
                          <span style={{color:"#22c55e",fontWeight:700,fontSize:15}}>✓ Through</span>
                          <span style={{color:"#475569",fontSize:12}}>{through.length} group{through.length!==1?"s":""} whose 3rd place is clearly in the top 8</span>
                        </div>
                        {through.map((entry,i)=><ThirdEntry key={entry.g} entry={entry} rank={i+1} tier="through"/>)}
                      </div>
                      {contested.length>0&&(
                        <div style={{marginBottom:24}}>
                          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:4,borderBottom:"2px solid #f59e0b",paddingBottom:6}}>
                            <span style={{color:"#f59e0b",fontWeight:700,fontSize:15}}>⚖️ Contested</span>
                            <span style={{color:"#475569",fontSize:12}}>{contested.length} teams tied for {spotsLeft} remaining spot{spotsLeft!==1?"s":""}</span>
                          </div>
                          <div style={{color:"#7c93b0",fontSize:11,marginBottom:10}}>Qualification still genuinely uncertain — competing for the remaining spot(s).</div>
                          {contested.map((entry)=><ThirdEntry key={entry.g} entry={entry} tier="contested"/>)}
                        </div>
                      )}
                      {longshot.length>0&&(
                        <div style={{marginBottom:24}}>
                          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,borderBottom:"2px solid #334155",paddingBottom:6}}>
                            <span style={{color:"#94a3b8",fontWeight:700,fontSize:15}}>Long shots</span>
                            <span style={{color:"#475569",fontSize:12}}>Qualify only in rare simulations</span>
                          </div>
                          {longshot.map((entry)=><ThirdEntry key={entry.g} entry={entry} tier="out"/>)}
                        </div>
                      )}
                      <div style={{background:"#061228",border:"1px solid #1e3a5f",borderRadius:10,padding:"14px 16px"}}>
                        <div style={{color:"#60a5fa",fontWeight:700,fontSize:13,marginBottom:6}}>How qualification works</div>
                        <div style={{color:"#64748b",fontSize:12,lineHeight:1.7}}>
                          The 8 best third-placed teams advance, ranked by pts → GD → goals scored → fair play. Where two teams from the same group both appear (e.g. Australia / Paraguay), they play each other in MD3 — only one can finish 3rd, so the % shown is their combined chance of that slot qualifying. Each qualifier is then assigned to one of 8 pre-set R32 slots via the FIFA 495-combination table.
                        </div>
                      </div>
                    </div>
                  )}
                  {!done&&(<div style={{color:"#475569",fontSize:14,padding:"40px 0",textAlign:"center"}}>⏳ Running {N.toLocaleString()} simulations…</div>)}
                </div>
              );
            })()}

            {/* =============== KNOCKOUT ROUND TABS =============== */}
            {["r32","r16","qf","sf","final"].map(rnd=>{
              if(tab!==rnd)return null;
              const slots=KO[rnd]||[];
              const label=ROUND_LABELS[rnd];
              const n=rnd==="r32"?16:rnd==="r16"?8:rnd==="qf"?4:rnd==="sf"?2:1;
              return (
                <div key={rnd}>
                  <h2 style={{fontSize:18,fontWeight:700,color:"#f1f5f9",marginBottom:4}}>{label}</h2>
                  <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16,flexWrap:"wrap"}}>
                    <p style={{color:"#64748b",fontSize:13,margin:0}}>
                      {n} match{n>1?"es":""} — top 3 most likely matchups from {N.toLocaleString()} simulations using live standings (Groups A–C final)
                    </p>
                    <span style={{
                      background:"#0f3024",color:"#4ade80",
                      padding:"2px 10px",borderRadius:12,fontSize:11,fontWeight:700,flexShrink:0
                    }}>🔴 LIVE</span>
                  </div>
                  {slots.map((slot,idx)=>{
                    const rows=getSlotRows(rnd,idx);
                    return <SlotCard key={slot.m} slot={slot} rows={rows} N={N} tier={rnd} prices={prices}/>;
                  })}
                </div>
              );
            })}

            {/* FOOTER */}
            <div style={{
              borderTop:"1px solid #1e3a5f",
              paddingTop:20,
              marginTop:20,
              textAlign:"center",
              color:"#334155",
              fontSize:12,
            }}>
              Monte Carlo simulation using live group standings · Official FIFA rankings (April 2026) · Updated Jun 24, 2026 · Built by{" "}
              <a href="https://debangandey.rbind.io" style={{color:"#475569",textDecoration:"none"}}>Debangan Dey</a>
            </div>
              </div>{/* /tab content */}
            </div>{/* /main scroll area */}
          </div>{/* /body row */}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
