    function haversine(lat1,lon1,lat2,lon2){
      const R=3959,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
      const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R*2*Math.asin(Math.sqrt(a));
    }

      if(miles<350) return {low:30,high:90,mode:"🚗 Drive"};

      if(miles<1500) return {low:200,high:500,mode:"✈️ Fly"};
      if(miles<2500) return {low:300,high:700,mode:"✈️ Fly"};
      return {low:400,high:1000,mode:"✈️ Intl. Flight"};
    }

    async function geocodeCity(query){
      const params=new URLSearchParams({
        q: query,
        format:"json",
        limit:"3",
        countrycodes:"us,mx,ca",
        "accept-language":"en",
      });
      const resp=await fetch(`https://nominatim.openstreetmap.org/search?${params}`,{
        headers:{"User-Agent":"wc2026-bracket/1.0"}
      });
      if(!resp.ok) throw new Error("Geocoding request failed");
      const data=await resp.json();
      if(!data.length) return null;
      const hit=data[0];
      // Build a short display name: "City, State/Province"
      const parts=hit.display_name.split(",").map(s=>s.trim());
      const shortName=parts.slice(0,2).join(", ");
      return {n:shortName, lat:parseFloat(hit.lat), lng:parseFloat(hit.lon)};
    }

    /* ===================== SIMULATION FUNCTIONS ===================== */
    function simGroup(teams){
      const pts={},gd={};
      teams.forEach(t=>{pts[t]=0;gd[t]=0;});
      for(let i=0;i<teams.length;i++){
        for(let j=i+1;j<teams.length;j++){
          const a=teams[i],b=teams[j],pA=wp(a,b)*0.75,r=Math.random();
          if(r<pA){pts[a]+=3;gd[a]+=(1+Math.random());gd[b]-=Math.random();}
          else if(r<pA+0.25){pts[a]+=1;pts[b]+=1;}
          else{pts[b]+=3;gd[b]+=(1+Math.random());gd[a]-=Math.random();}
        }
      }
      return [...teams].sort((a,b)=>pts[b]-pts[a]||gd[b]-gd[a]||Math.random()-.5);
    }
    function assign3rd(thirds){
      const slots=Object.keys(SLOT_ALLOW),res={},used=new Set();
      let changed=true;
      while(changed){
        changed=false;
        for(const s of slots){
          if(res[s])continue;
          const v=thirds.filter(t=>!used.has(t.team)&&SLOT_ALLOW[s].includes(t.group));
          if(v.length===1){res[s]=v[0].team;used.add(v[0].team);changed=true;}
        }
      }
      for(const s of slots){
        if(res[s])continue;
        const v=thirds.filter(t=>!used.has(t.team)&&SLOT_ALLOW[s].includes(t.group));
        if(v.length>0){res[s]=v[0].team;used.add(v[0].team);}
        else res[s]="TBD";
      }
      return res;
    }
    function runOnce(){
      const W={},R={},thirds=[];
      for(const[g,{teams}]of Object.entries(GROUPS)){
        const rk=simGroup(teams);
        W[g]=rk[0];R[g]=rk[1];
        thirds.push({team:rk[2],group:g,pts:e(rk[2])});
      }
      thirds.sort((a,b)=>b.pts-a.pts);
      const sg=assign3rd(thirds);
      const gv=k=>sg[k]||"TBD";
      const ok=(a,b)=>a&&b&&a!=="TBD"&&b!=="TBD"&&a!==b;
      const key=(a,b)=>[a,b].sort().join("|");
      const r32p=[
        [W.E,gv("M74")],[W.I,gv("M77")],[R.A,R.B],[W.F,R.C],
        [R.K,R.L],[W.H,R.J],[W.D,gv("M81")],[W.G,gv("M82")],
        [W.C,R.F],[R.E,R.I],[W.A,gv("M79")],[W.L,gv("M80")],
        [W.J,R.H],[R.D,R.G],[W.B,gv("M85")],[W.K,gv("M87")],
      ];
      const out={r32:[],r16:[],qf:[],sf:[],final:[]};
      const r32w=r32p.map(([a,b],idx)=>{
        if(!ok(a,b))return a&&a!=="TBD"?a:b&&b!=="TBD"?b:"TBD";
        out.r32.push({idx,key:key(a,b),teamA:a,teamB:b});
        return simMatch(a,b);
      });
      const r16p=[[r32w[0],r32w[1]],[r32w[2],r32w[3]],[r32w[4],r32w[5]],[r32w[6],r32w[7]],
                  [r32w[8],r32w[9]],[r32w[10],r32w[11]],[r32w[12],r32w[13]],[r32w[14],r32w[15]]];
      const r16w=r16p.map(([a,b],idx)=>{
        if(!ok(a,b))return a&&a!=="TBD"?a:b&&b!=="TBD"?b:"TBD";
        out.r16.push({idx,key:key(a,b),teamA:a,teamB:b});
        return simMatch(a,b);
      });
      const qfp=[[r16w[0],r16w[1]],[r16w[2],r16w[3]],[r16w[4],r16w[5]],[r16w[6],r16w[7]]];
      const qfw=qfp.map(([a,b],idx)=>{
        if(!ok(a,b))return a&&a!=="TBD"?a:b&&b!=="TBD"?b:"TBD";
        out.qf.push({idx,key:key(a,b),teamA:a,teamB:b});
        return simMatch(a,b);
      });
      const sfp=[[qfw[0],qfw[1]],[qfw[2],qfw[3]]];
      const sfw=sfp.map(([a,b],idx)=>{
        if(!ok(a,b))return a&&a!=="TBD"?a:b&&b!=="TBD"?b:"TBD";
        out.sf.push({idx,key:key(a,b),teamA:a,teamB:b});
        return simMatch(a,b);
      });
      // SF losers → Third Place (M103, KO.final[0], idx:0)
      const sfLos=[
        ok(sfp[0][0],sfp[0][1])?(sfp[0][0]===sfw[0]?sfp[0][1]:sfp[0][0]):"TBD",
        ok(sfp[1][0],sfp[1][1])?(sfp[1][0]===sfw[1]?sfp[1][1]:sfp[1][0]):"TBD",
      ];
      if(ok(sfLos[0],sfLos[1])) out.final.push({idx:0,key:key(sfLos[0],sfLos[1]),teamA:sfLos[0],teamB:sfLos[1]});
      // SF winners → Championship (M104, KO.final[1], idx:1)
      let champion="TBD";
      if(ok(sfw[0],sfw[1])){out.final.push({idx:1,key:key(sfw[0],sfw[1]),teamA:sfw[0],teamB:sfw[1]});champion=simMatch(sfw[0],sfw[1]);}
      else champion=sfw[0]!=="TBD"?sfw[0]:sfw[1];
      // Track team appearances per round per slot
      const teamSlots={r32:{},r16:{},qf:{},sf:{},final:{}};
      for(const [rnd,matches] of Object.entries(out)){
        for(const {idx,teamA,teamB} of matches){
          if(!teamSlots[rnd][idx]) teamSlots[rnd][idx]={};
          for(const t of [teamA,teamB]){
            if(t&&t!=="TBD") teamSlots[rnd][idx][t]=(teamSlots[rnd][idx][t]||0)+1;
          }
        }
      }
      // Track team wins per round (advancing teams)
      const teamRounds={r32:{},r16:{},qf:{},sf:{},final:{}};
      const advancers={
        r32:r32w,r16:r16w,qf:qfw,sf:sfw,final:[champion]
      };
      for(const [rnd,teams] of Object.entries(advancers)){
        for(const t of teams){
          if(t&&t!=="TBD") teamRounds[rnd][t]=(teamRounds[rnd][t]||0)+1;
        }
      }
      return {rounds:out,champion,teamSlots,teamRounds};
    }

            // matchup counts

              for(const{idx,key}of matches){
                if(!sc[rnd][idx])sc[rnd][idx]={};
                sc[rnd][idx][key]=(sc[rnd][idx][key]||0)+1;
              }
            }
            // team slot counts
            for(const[rnd,slots]of Object.entries(teamSlots)){
              for(const[idx,teams]of Object.entries(slots)){
                if(!ts[rnd][idx])ts[rnd][idx]={};
                for(const[t,c]of Object.entries(teams)){
                  ts[rnd][idx][t]=(ts[rnd][idx][t]||0)+c;
                }
              }
            }
            // team round advancement
            for(const[rnd,teams]of Object.entries(teamRounds)){
              for(const[t,c]of Object.entries(teams)){
                if(!tr[rnd][t])tr[rnd][t]=0;
                tr[rnd][t]+=c;
              }
            }
            // champion counts
            if(champion&&champion!=="TBD") cc[champion]=(cc[champion]||0)+1;
          }
          done=end;
          setProgress(done);
          if(done<N){
            setTimeout(runChunk,0);
          } else {
            setSimData({...sc});
            setTeamSlotData({...ts});
            setTeamRoundData({...tr});
            setChampionData({...cc});
            setDone(true);
          }
        }
        runChunk();
      },[]);

      // Prices useEffect

            fillColor:color,
            weight:isSelected?3:2,

      const allVenues=useMemo(()=>getAllVenues(),[]);

      // Build slot rows from simData
      function getSlotRows(rnd,idx){
        const data=simData[rnd]&&simData[rnd][idx]?simData[rnd][idx]:{};
        return Object.entries(data)
          .sort(([,a],[,b])=>b-a)
          .slice(0,3)
          .map(([k,count])=>{
            const [a,b]=k.split("|");
            return {a,b,count};

      // Track a team data
      const trackData=useMemo(()=>{
        if(!trackTeam)return null;
        // find group

        for(const[g,go]of Object.entries(GROUPS)){
          if(go.teams.includes(trackTeam)){teamGroup=g;groupObj=go;break;}

        // round data
        const rounds=["r32","r16","qf","sf","final"];
        const roundInfo=rounds.map(rnd=>{
          const roundRoundData=teamRoundData[rnd]||{};

          const pct=(teamCount/N*100);
          // find which slots this team appeared in
          const slotData=teamSlotData[rnd]||{};
          const mySlots=[];
          for(const[idx,teams]of Object.entries(slotData)){

              const opps=Object.entries(teams)
                .filter(([t])=>t!==trackTeam)

              mySlots.push({idx:Number(idx),slotFreq:(teams[trackTeam]/N*100),opps});
            }
          }
          mySlots.sort((a,b)=>b.slotFreq-a.slotFreq);
          return {rnd,pct,slots:mySlots};

                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>

          })()}

          {/* TAB BAR — constrained width */}

            <div style={{

              {tabs.map(t=>(

                {done&&champRows.filter(t=>t.count===0).length>0&&(

                    <div style={{

                    }}>

                      <span style={{color:"#374151",fontSize:12}}>0% across all simulations</span>

            {/* =============== TRACK A TEAM TAB =============== */}
            {tab==="track"&&(

                                <span style={{fontSize:17,fontWeight:700,color:"#f1f5f9"}}>
                                  {t2!=="TBD"?`${fl(t2)} ${t2}`:"TBD"}
                                  <span style={{color:"#475569",fontSize:12,margin:"0 4px"}}>#{RANKS[t2]||"–"}</span>
                                </span>
                                {certain&&group&&<span style={{color:"#64748b",fontSize:11,background:"#0d1f3c",padding:"1px 8px",borderRadius:10}}>Group {group}</span>}
                                {!certain&&pct!==null&&(
                                  <span style={{background:"#1e3a5f",color:"#93c5fd",fontSize:11,fontWeight:700,padding:"2px 8px",borderRadius:10}}>
                                    {pct}% likely
                                  </span>
                                )}
                              </div>

                              {/* Alt matchups for KO */}
                              {!certain&&altMatchups.length>0&&done&&(
                                <div style={{color:"#334155",fontSize:11,marginBottom:6}}>
                                  <span style={{color:"#475569",marginRight:4}}>Also possible:</span>
                                  {altMatchups.map((m,j)=>(
                                    <span key={j} style={{marginRight:10}}>
                                      {fl(m.ta)}{fl(m.tb)} {m.pct}%
                                    </span>
                                  ))}
                                </div>
                              )}
                              {!certain&&!done&&<div style={{color:"#334155",fontSize:11,marginBottom:6}}>Sim running…</div>}

                              {/* ── Venue + distance ── */}
                              <div style={{
                                display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",
                                padding:"7px 0",borderTop:"1px solid #0d1f3c",borderBottom:"1px solid #0d1f3c",
                                margin:"6px 0",
                              }}>
                                <span style={{color:"#64748b",fontSize:12,fontWeight:600}}>📍 {venue}</span>
                                {isDayTrip&&<span style={{background:"#052e16",color:"#4ade80",fontSize:10,fontWeight:700,padding:"2px 8px",borderRadius:10,border:"1px solid #166534"}}>🚗 Day trip</span>}
                                {vt==="canada"&&<span style={{color:"#22c55e",fontSize:11}}>🍁 Canada</span>}
                                {vt==="mexico"&&<span style={{color:"#f97316",fontSize:11}}>🇲🇽 Mexico</span>}
                                <span style={{color:"#475569",fontSize:11,marginLeft:"auto"}}>{dist.toLocaleString()} mi · {tc.mode}</span>
                              </div>

                              {/* ── Cost breakdown ── */}
                              <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",marginTop:8}}>
                                <span style={{color:totalColor,fontWeight:800,fontSize:16,marginRight:4}}>
                                  ${totalLow.toLocaleString()}–${totalHigh.toLocaleString()}
                                </span>
                                <span style={{background:"#0d1f3c",border:"1px solid #1e3a5f",color:"#93c5fd",fontSize:11,padding:"2px 8px",borderRadius:20}}>
                                  ✈️ ${tc.low}–${tc.high}
                                </span>
                                <span style={{background:"#0d1f3c",border:"1px solid #1e3a5f",color:isDayTrip?"#4ade80":"#fcd34d",fontSize:11,padding:"2px 8px",borderRadius:20}}>
                                  {isDayTrip?"🚗 No hotel":`🏨 $${hc.low}–$${hc.high}/nt`}
                                </span>
                                <span style={{background:"#0d1f3c",border:`1px solid ${hasLiveTicket?"#166534":"#1e3a5f"}`,color:"#c4b5fd",fontSize:11,padding:"2px 8px",borderRadius:20}}>
                                  🎟️ ${tk.low}–${tk.high}
                                </span>
                              </div>
                            </div>

                            {/* Flight link */}
                            {showFlight&&(
                              <div onClick={ev=>ev.stopPropagation()} style={{marginTop:10}}>
                                <FlightsButton fromCity={homeCity.n.split(",")[0]} toCity={venueCity}/>
                              </div>
                            )}
                          </div>
                        );
                      })}

                      {sorted.length>3&&(
                        <div style={{color:"#334155",fontSize:11,textAlign:"center",padding:"6px 0"}}>
                          +{sorted.length-3} more {ROUND_LABEL[tripRound]} matches available — click any map pin to explore a venue
                        </div>
                      )}
                      <div style={{color:"#334155",fontSize:11,marginTop:10}}>
                        * Quality ★ = avg ELO of both teams. Day trip = within {DAY_TRIP_MILES} mi. All costs estimated. 🎟️ Live price = real VividSeats listing.
                      </div>
                    </div>
                  );
                })():(
                  <div style={{color:"#475569",textAlign:"center",padding:"40px 0",fontSize:14}}>
                    Select your home city above to see the best matches to attend
                  </div>
                )}
              </div>
            )}

            {/* =============== FIFA RANKINGS TAB =============== */}
            {tab==="rankings"&&(
              <div>
                <h2 style={{fontSize:18,fontWeight:700,color:"#f1f5f9",marginBottom:4}}>📊 FIFA World Rankings</h2>
                <p style={{color:"#64748b",fontSize:13,marginBottom:20}}>All 48 qualified teams ranked by ELO rating with recent form indicator</p>
                <div style={{
                  display:"grid",gap:5,
                }}>
                  {SORTED_ELO.map(([t,elo],i)=>{
                    const f=FORM[t]||0;
                    const maxElo=SORTED_ELO[0][1];
                    const barW=(elo/maxElo)*100;
                    const teamColor=COLORS[t]||"#334155";
                    return (
                      <div key={t} style={{
                        background:"#061228",border:"1px solid #1e3a5f",
                        borderRadius:8,padding:"8px 12px",
                        display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"
                      }}>
                        <span style={{color:"#475569",fontSize:12,minWidth:24,textAlign:"right"}}>{i+1}</span>
                        <span style={{fontSize:20}}>{fl(t)}</span>
                        <div style={{flex:1,minWidth:120}}>
                          <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3,flexWrap:"wrap"}}>
                            <span style={{fontWeight:600,fontSize:13}}>{t}</span>
                            <span style={{
                              color:fc(f),fontSize:11,fontWeight:700,
                              background:"#0d1f3c",padding:"1px 6px",borderRadius:10
                            }}>{fa(f)}</span>
                          </div>
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <div style={{flex:1,height:6,background:"#0d1f3c",borderRadius:3,overflow:"hidden"}}>
                              <div style={{width:`${barW}%`,height:"100%",background:teamColor,borderRadius:3}}/>
                            </div>
                            <span style={{color:"#60a5fa",fontSize:12,fontWeight:700,minWidth:36,textAlign:"right"}}>{elo}</span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* =============== GROUP STAGE TAB =============== */}
            {tab==="groups"&&(
              <div>
                <h2 style={{fontSize:18,fontWeight:700,color:"#f1f5f9",marginBottom:4}}>🏟️ Group Stage</h2>
                <p style={{color:"#64748b",fontSize:13,marginBottom:20}}>All 12 groups with projected qualifiers and match schedule</p>
                {Object.entries(GROUPS).map(([letter,g])=>(
                  <GroupCard key={letter} letter={letter} g={g} />
                ))}
              </div>
            )}

            {/* =============== KNOCKOUT ROUND TABS =============== */}
            {["r32","r16","qf","sf","final"].map(rnd=>{
              if(tab!==rnd)return null;
              const slots=KO[rnd]||[];
              const label=ROUND_LABELS[rnd];
              const n=rnd==="r32"?16:rnd==="r16"?8:rnd==="qf"?4:rnd==="sf"?2:2;
              return (
                <div key={rnd}>
                  <h2 style={{fontSize:18,fontWeight:700,color:"#f1f5f9",marginBottom:4}}>{label}</h2>
                  <p style={{color:"#64748b",fontSize:13,marginBottom:20}}>
                    {n} match{n>1?"es":""} — top 3 most likely matchups from {N.toLocaleString()} simulations
                  </p>
                  {slots.map((slot,idx)=>{
                    const rows=getSlotRows(rnd,idx);
                    return <SlotCard key={slot.m} slot={slot} rows={rows} N={N} tier={rnd} prices={prices}/>;
                  })}
                </div>
              );
            })}

            {/* FOOTER */}
            <div style={{
              borderTop:"1px solid #1e3a5f",
              paddingTop:20,
              marginTop:20,
              textAlign:"center",
              color:"#334155",
              fontSize:12,
            }}>
              Monte Carlo simulation using official FIFA rankings (April 2026) · Built by{" "}
              <a href="https://debangandey.rbind.io" style={{color:"#475569",textDecoration:"none"}}>Debangan Dey</a>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
