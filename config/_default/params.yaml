# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/
# This file is formatted using YAML syntax - learn more at https://learnxinyminutes.com/docs/yaml/

# Appearance
appearance:
  mode: light
  color: indigo
  
stylesheets:
  - css/custom.css

# SEO
marketing:
  seo:
    site_type: Organization
    local_business_type: ''
    org_name: 'CADENCE Lab, Department of Statistics, Texas A&M University'
    description: 'CADENCE Lab — Contextual Analytics of Digital & Environmental data for Neurobehavioral, Circadian & Emotional health (PI: Debangan Dey), Department of Statistics, Texas A&M University. Statistics for the rhythms of health across space and time: wearables, EMA, environment, sleep, circadian rhythms and mental health.'
    twitter: 'debangan07'
  analytics:
    google_analytics: 'CXHH8ELK0W'
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

# Site header
header:
  navbar:
    enable: true
    blox: "navbar"
    fixed_to_top: true
    show_search: true
    show_theme_chooser: true
    logo:
      text: "CADENCE Lab"

# Site footer
footer:
  copyright:
    notice: '© {year} CADENCE Lab · Department of Statistics, Texas A&M University. This work is licensed under {license}'
    license:
      enable: true
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

# Localization
locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

# Site features
features:
  math:
    enable: true
  privacy_pack:
    enable: false
